    PriceAlteration:
      type: object
      description: Is an amount, usually of money, that modifies the price charged for
        an order item.
      required:
        - price
        - priceType
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        applicationDuration:
          type: integer
          description: Duration during which the alteration applies on the order item
            price (for instance 2 months free of charge for the recurring
            charge)
        description:
          type: string
          description: A narrative that explains in detail the semantics of this order
            item price alteration
        name:
          type: string
          description: Name of the order item price alteration
        priceType:
          type: string
          description: A category that describes the price such as recurring, one time and
            usage.
        priority:
          type: integer
          description: Priority level for applying this alteration among all the defined
            alterations on the order item price
        recurringChargePeriod:
          type: string
          description: Could be month, week...
        unitOfMeasure:
          type: string
          description: Could be minutes, GB...
        price:
          $ref: "#/components/schemas/Price"
        productOfferingPrice:
          $ref: "#/components/schemas/ProductOfferingPriceRef"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    Product:
      type: object
      description: A product offering procured by a customer or other interested party
        playing a party role. A product is realized as one or more service(s)
        and / or resource(s).
      properties:
        id:
          type: string
          description: Unique identifier of the product
        href:
          type: string
          format: uri
          description: Reference of the product
        description:
          type: string
          description: Is the description of the product. It could be copied from the
            description of the Product Offering.
        isBundle:
          type: boolean
          description: If true, the product is a ProductBundle which is an instantiation
            of a BundledProductOffering. If false, the product is a
            ProductComponent which is an instantiation of a
            SimpleProductOffering.
        isCustomerVisible:
          type: boolean
          description: If true, the product is visible by the customer.
        name:
