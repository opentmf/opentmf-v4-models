components:
  schemas:
    Addressable:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
    AgreementItemRef:
      type: object
      description: Agreement reference. An agreement represents a contract or
        arrangement, either written or verbal and sometimes enforceable by law,
        such as a service level agreement or a customer price agreement. An
        agreement involves a number of other business entities, such as
        products, services, and resources and/or their specifications.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        agreementItemId:
          type: string
          description: Identifier of the agreement
        name:
          type: string
          description: Name of the related entity.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    AgreementRef:
      type: object
      description: Agreement reference. An agreement represents a contract or
        arrangement, either written or verbal and sometimes enforceable by law,
        such as a service level agreement or a customer price agreement. An
        agreement involves a number of other business entities, such as
        products, services, and resources and/or their specifications.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        name:
          type: string
          description: Name of the agreement
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    AgreementSpecCharacteristic:
      type: object
      description: A characteristic quality or distinctive feature of an agreement.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        configurable:
          type: boolean
          description: If true, the Boolean indicates that the characteristic is
            configurable
        description:
          type: string
          description: A narrative that explains in detail what the characteristic is
        name:
          type: string
          description: Name of the characteristic being specified.
        valueType:
          type: string
          description: A kind of value that the characteristic can take on, such as
            numeric, text and so forth
        specCharacteristicValue:
          type: array
          items:
            $ref: "#/components/schemas/AgreementSpecCharacteristicValue"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    AgreementSpecCharacteristicValue:
      type: object
      description: A number or text that can be assigned to an agreement specification
        characteristic.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        default:
          type: boolean
          description: Indicates if the value is the default value for a characteristic
        unitOfMeasure:
          type: string
          description: Unit of measure for the characteristic, such as minutes, gigabytes
            (GB) and so on.
        valueFrom:
          type: string
          description: The low range value that a characteristic can take on
        valueTo:
          type: string
          description: The upper range value that a characteristic can take on
        valueType:
          type: string
          description: A kind of value that the characteristic can take on, such as
            numeric, text, and so forth
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        value:
          $ref: "#/components/schemas/Any"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    AgreementSpecification:
      type: object
      description: A template of an agreement that can be used when establishing
        partnerships
      required:
        - attachment
        - name
      properties:
        id:
          type: string
          description: Unique identifier of the agreement specification
        href:
          type: string
          format: uri
          description: Reference of the agreement specification
        description:
          type: string
          description: A narrative that explains in detail what the agreement
            specification is about
        isBundle:
          type: boolean
          description: If true, this agreement specification is a grouping of other
            agreement specifications. The list of bundled agreement
            specifications is provided by the specificationRelationship property
        lastUpdate:
          type: string
          format: date-time
          description: Date and time of the last update
        lifecycleStatus:
          type: string
          description: Indicates the current lifecycle status
        name:
