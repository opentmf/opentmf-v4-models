    CharacteristicSpecification:
      type: object
      description: This class defines a characteristic specification.
      properties:
        id:
          type: string
          description: Unique ID for the characteristic
        configurable:
          type: boolean
          description: If true, the Boolean indicates that the target Characteristic is
            configurable
        description:
          type: string
          description: A narrative that explains the CharacteristicSpecification.
        extensible:
          type: boolean
          description: An indicator that specifies that the values for the characteristic
            can be extended by adding new values when instantiating a
            characteristic for a resource.
        isUnique:
          type: boolean
          description: Specifies if the value of this characteristic is unique across all
            entities instantiated from the specification that uses this
            characteristc. For example, consider a ProductSpecification for a
            set-top box, with a CharacteristicSpecification cardID. Each set-top
            box must have a different value for cardID, so this isUnique
            attribute would be set to true for the characteristic.
        maxCardinality:
          type: integer
          description: The maximum number of instances a CharacteristicValue can take on.
            For example, zero to five phone numbers in a group calling plan,
            where five is the value for the maxCardinality.
        minCardinality:
          type: integer
          description: The minimum number of instances a CharacteristicValue can take on.
            For example, zero to five phone numbers in a group calling plan,
            where zero is the value for the minCardinality.
        name:
          type: string
          description: A word, term, or phrase by which this characteristic specification
            is known and distinguished from other characteristic specifications.
        regex:
          type: string
          description: A rule or principle represented in regular expression used to
            derive the value of a characteristic value.
        valueType:
          type: string
          description: A kind of value that the characteristic can take on, such as
            numeric, text and so forth
        charSpecRelationship:
          type: array
          items:
            $ref: "#/components/schemas/CharacteristicSpecificationRelationship"
          description: An aggregation, migration, substitution, dependency or exclusivity
            relationship between/among Specification Characteristics.
