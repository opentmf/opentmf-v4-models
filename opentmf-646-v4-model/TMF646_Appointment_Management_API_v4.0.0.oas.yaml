servers:
  - url: https://serverRoot/tmf-api/appointment/v4
components:
  schemas:
    Appointment:
      type: object
      description: An Appointment is an arrangement to do something or meet someone at
        a particular time, at a place (for face to face appointment) or in a
        contact medium (for phone appointment).
      required:
        - validFor
      properties:
        id:
          type: string
          description: Unique identifier of the appointment
        href:
          type: string
          format: uri
          description: Unique URI used to access to the appointment resource
        category:
          type: string
          description: "Business category : intervention for example or to be more precise
            after SalesIntervention, orderDeliveryIntervention,..."
        creationDate:
          type: string
          format: date-time
          description: Appointment creation date
        description:
          type: string
          description: Short free text describing the appointment
        externalId:
          type: string
          description: External reference known by the customer
        lastUpdate:
          type: string
          format: date-time
          description: Date of last appointment update
        attachment:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentRefOrValue"
        calendarEvent:
          $ref: "#/components/schemas/CalendarEventRef"
        contactMedium:
          type: array
          items:
            $ref: "#/components/schemas/ContactMedium"
        note:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        relatedEntity:
          type: array
          items:
            $ref: "#/components/schemas/RelatedEntity"
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
        relatedPlace:
          $ref: "#/components/schemas/RelatedPlaceRefOrValue"
        status:
          $ref: "#/components/schemas/AppointmentStateType"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Appointment_Create:
      type: object
      description: >-
        An Appointment is an arrangement to do something or meet someone at a
        particular time, at a place (for face to face appointment) or in a
        contact medium (for phone appointment).

        Skipped properties: id,href,status,creationDate,lastUpdate
      required:
        - validFor
      properties:
        category:
          type: string
          description: "Business category : intervention for example or to be more precise
            after SalesIntervention, orderDeliveryIntervention,..."
        description:
          type: string
          description: Short free text describing the appointment
        externalId:
          type: string
          description: External reference known by the customer
        attachment:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentRefOrValue"
        calendarEvent:
          $ref: "#/components/schemas/CalendarEventRef"
        contactMedium:
          type: array
          items:
            $ref: "#/components/schemas/ContactMedium"
        note:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        relatedEntity:
          type: array
          items:
            $ref: "#/components/schemas/RelatedEntity"
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
        relatedPlace:
          $ref: "#/components/schemas/RelatedPlaceRefOrValue"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Appointment_Update:
      type: object
      description: >-
        An Appointment is an arrangement to do something or meet someone at a
        particular time, at a place (for face to face appointment) or in a
        contact medium (for phone appointment).

        Skipped properties: id,href,creationDate
      required:
        - validFor
      properties:
        category:
          type: string
          description: "Business category : intervention for example or to be more precise
            after SalesIntervention, orderDeliveryIntervention,..."
        description:
          type: string
          description: Short free text describing the appointment
        externalId:
          type: string
          description: External reference known by the customer
        lastUpdate:
          type: string
          format: date-time
          description: Date of last appointment update
        attachment:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentRefOrValue"
        calendarEvent:
          $ref: "#/components/schemas/CalendarEventRef"
        contactMedium:
          type: array
          items:
            $ref: "#/components/schemas/ContactMedium"
        note:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        relatedEntity:
          type: array
          items:
            $ref: "#/components/schemas/RelatedEntity"
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
        relatedPlace:
          $ref: "#/components/schemas/RelatedPlaceRefOrValue"
        status:
          $ref: "#/components/schemas/AppointmentStateType"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
