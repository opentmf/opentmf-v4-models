    ServiceRefOrValue:
      type: object
      description: A Service to be created defined by value or existing defined by
        reference. The polymorphic attributes @type, @schemaLocation &
        @referredType are related to the Service entity and not the
        RelatedServiceRefOrValue class itself
      properties:
        id:
          type: string
          description: Unique identifier of the service
        href:
          type: string
          format: uri
          description: Reference of the service
        category:
          type: string
          description: Is it a customer facing or resource facing service
        description:
          type: string
          description: Free-text description of the service
        endDate:
          type: string
          format: date-time
          description: Date when the service ends
        hasStarted:
          type: boolean
          description: If TRUE, this Service has already been started
        isBundle:
          type: boolean
          description: If true, the service is a ServiceBundle which regroup a service
            hierachy. If false, the service is a 'atomic' service (hierachy
            leaf).
        isServiceEnabled:
          type: boolean
          description: "If FALSE and hasStarted is FALSE, this particular Service has NOT
            been enabled for use - if FALSE and hasStarted is TRUE then the
            service has failed "
        isStateful:
          type: boolean
          description: If TRUE, this Service can be changed without affecting any other
            services
        name:
          type: string
          description: Name of the service
        serviceDate:
          type: string
          format: date-time
          description: Date when the service was created (whatever its status).
        serviceType:
          type: string
          description: Business type of the service
        startDate:
          type: string
          format: date-time
          description: Date when the service starts
        startMode:
          type: string
          description: "This attribute is an enumerated integer that indicates how the
            Service is started, such as: 0: Unknown; 1: Automatically by the
            managed environment; 2: Automatically by the owning device; 3:
            Manually by the Provider of the Service; 4: Manually by a Customer
            of the Provider; 5: Any of the above"
        feature:
          type: array
          items:
            $ref: "#/components/schemas/Feature"
          description: "A list of feature associated with this service "
        note:
          type: array
          items:
            $ref: "#/components/schemas/Note"
          description: A list of notes made on this service
        place:
          type: array
          items:
            $ref: "#/components/schemas/RelatedPlaceRefOrValue"
          description: A list of places (Place [*]). Used to define a place useful for the
            service (for example a geographical place whre the service is
            installed)
        relatedEntity:
          type: array
          items:
            $ref: "#/components/schemas/RelatedEntityRefOrValue"
          description: "A list of related  entity in relationship with this service "
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
          description: A list of related party references (RelatedParty [*]). A related
            party defines party or party role linked to a specific entity
        serviceCharacteristic:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
          description: "A list of characteristics that characterize this service
            (ServiceCharacteristic [*]) "
        serviceOrderItem:
          type: array
          items:
            $ref: "#/components/schemas/RelatedServiceOrderItem"
          description: A list of service order items related to this service
        serviceRelationship:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRelationship"
          description: A list of service relationships (ServiceRelationship [*]).
            Describes links with other service(s) in the inventory.
        serviceSpecification:
          $ref: "#/components/schemas/ServiceSpecificationRef"
        state:
          $ref: "#/components/schemas/ServiceStateType"
        supportingResource:
          type: array
          items:
            $ref: "#/components/schemas/ResourceRef"
          description: "A list of supporting resources (SupportingResource [*]).Note: only
            Service of type RFS can be associated with Resources"
        supportingService:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRefOrValue"
          description: A list of supporting services (SupportingService [*]). A collection
            of services that support this service (bundling, link CFS to RFS)
