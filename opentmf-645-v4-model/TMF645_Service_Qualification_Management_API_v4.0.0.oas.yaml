servers:
  - url: https://serverRoot/tmf-api/serviceQualificationManagement/v4
components:
  schemas:
    Addressable:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    AlternateServiceProposal:
      type: object
      description: Alternate service proposal is used when the requested service is
        not available with characteristic and date asked for. An alternate
        proposal could be a distinct serviceSpecification close to requested one
        or same as requested but with a different activation date
      properties:
        id:
          type: string
          description: Identifier of a alternate service proposal
        alternateServiceAvailabilityDate:
          type: string
          format: date-time
          description: Alternate availability date in case seller is not able to meet
            requested expected availability date for the service
        alternateService:
          $ref: "#/components/schemas/ServiceRefOrValue"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Any: {}
    Characteristic:
      type: object
      description: Describes a given characteristic of an object or entity through a
        name/value pair.
      required:
        - name
        - value
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        name:
          type: string
          description: Name of the characteristic
        valueType:
          type: string
          description: Data type of the value of the characteristic
        characteristicRelationship:
          type: array
          items:
            $ref: "#/components/schemas/CharacteristicRelationship"
        value:
          $ref: "#/components/schemas/Any"
        "@baseType":
          example: ResourceSpecification
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          example: https://mycsp.com:8080/tmf-api/schema/Resource/LogicalResourceSpecification.schema.json
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          example: LogicalResourceSpecification
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    CharacteristicRelationship:
      type: object
      description: Another Characteristic that is related to the current Characteristic;
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        relationshipType:
          type: string
          description: The type of relationship
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CheckServiceQualification:
      type: object
      description: CheckServiceQualification is used to perform a technical
        eligibility on service configuration(s). It allows to retrieve services
        that are technically available in the context of the interaction (place,
        party, service characteristics, ...).
      properties:
        id:
          type: string
          description: Unique identifier of the serviceQualification resource
        href:
          type: string
          format: uri
          description: Hyperlink to access the serviceQualification
        checkServiceQualificationDate:
          type: string
          format: date-time
          description: Date when the serviceQualification was submitted
        description:
          type: string
          description: Description of the serviceQualification
        effectiveQualificationDate:
          type: string
          format: date-time
          description: Effective date to serviceQualification completion
        estimatedResponseDate:
          type: string
          format: date-time
          description: Date when the requester expect to provide an answer for the
            qualification request.
        expectedQualificationDate:
          type: string
          format: date-time
          description: A date (DateTime). Deadline date when the requester expected a
            qualification answer.
        expirationDate:
          type: string
          format: date-time
          description: Date when the qualification response expires
        externalId:
          type: string
          description: Identifier provided by the requester
        instantSyncQualification:
          type: boolean
          description: An indicator which when the value is "true" means that requester
            expects to get qualifcation result immediately in the response. If
            the indicator is true then the response code of 200 indicates the
            operation is successful otherwise a task is created with a response
            201.
        provideAlternative:
          default: false
          type: boolean
          description: When the value is TRUE means that alternative solutions should be
            provided
        provideUnavailabilityReason:
          default: false
          type: boolean
          description: When the value is TRUE means that unavailability reason are
            expected for non available service.
        qualificationResult:
          type: string
          description: "Qualification result for this serviceQualification. It could
            be:  qualified (all qualification item are qualified), alternate (At
            least one item alternate and no item with  unqualified), unqualified
            (At least one item unqualified)"
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
          description: A list of related party references, defines party or party role
            linked to this request.
        serviceQualificationItem:
          type: array
          items:
            $ref: "#/components/schemas/CheckServiceQualificationItem"
          description: A list of service qualification items.
        state:
          $ref: "#/components/schemas/TaskStateType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CheckServiceQualification_Create:
      type: object
      description: >-
        CheckServiceQualification is used to perform a technical eligibility on
        service configuration(s). It allows to retrieve services that are
        technically available in the context of the interaction (place, party,
        service characteristics, ...).

        Skipped properties: id,href,state,effectiveQualificationDate,qualificationResult,expirationDate,checkServiceQualificationDate,estimatedResponseDate,serviceQualificationItem.alternateServiceProposal,serviceQualificationItem.state,serviceQualificationItem.qualificationResult
      required:
        - serviceQualificationItem
      properties:
        description:
          type: string
          description: Description of the serviceQualification
        expectedQualificationDate:
          type: string
          format: date-time
          description: A date (DateTime). Deadline date when the requester expected a
            qualification answer.
        externalId:
          type: string
          description: Identifier provided by the requester
        instantSyncQualification:
          type: boolean
          description: An indicator which when the value is "true" means that requester
            expects to get qualifcation result immediately in the response. If
            the indicator is true then the response code of 200 indicates the
            operation is successful otherwise a task is created with a response
            201.
        provideAlternative:
          default: false
          type: boolean
          description: When the value is TRUE means that alternative solutions should be
            provided
        provideUnavailabilityReason:
          default: false
          type: boolean
          description: When the value is TRUE means that unavailability reason are
            expected for non available service.
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
          description: A list of related party references, defines party or party role
            linked to this request.
        serviceQualificationItem:
          type: array
          items:
            $ref: "#/components/schemas/CheckServiceQualificationItem"
          minItems: 1
          description: A list of service qualification items.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CheckServiceQualification_Update:
      type: object
      description: >-
        CheckServiceQualification is used to perform a technical eligibility on
        service configuration(s). It allows to retrieve services that are
        technically available in the context of the interaction (place, party,
        service characteristics, ...).

        Skipped properties: id,href,checkServiceQualificationDate
      properties:
        description:
          type: string
          description: Description of the serviceQualification
        effectiveQualificationDate:
          type: string
          format: date-time
