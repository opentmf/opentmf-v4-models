servers:
  - url: https://serverRoot/tmf-api/prepayBalanceManagement/v4
components:
  schemas:
    AccumulatedBalance:
      type: object
      description: Represents and tracks the aggregated amount remained or owed in
        certain account which is owned by certain customer for a set of buckets.
      required:
        - bucket
        - name
        - totalBalance
      properties:
        id:
          type: string
          description: Unique Identifier within the server for the recharge operation
            request
        href:
          type: string
          format: uri
          description: A resource URI pointing to the resource in the OB that stores the
            detailed information.
        description:
          type: string
          description: Text describing the contents of the aggregated balance
        name:
          type: string
          description: Friendly name to identify the aggregated balance
        bucket:
          type: array
          items:
            $ref: "#/components/schemas/BucketRef"
          minItems: 1
          description: A reference to the buckets involved in the aggregation
        logicalResource:
          $ref: "#/components/schemas/LogicalResourceRef"
        partyAccount:
          $ref: "#/components/schemas/PartyAccountRef"
        product:
          type: array
          items:
            $ref: "#/components/schemas/ProductRef"
          description: A reference to the product whose consumption is managed by the
            bucket . This is an array to allow scenarios where a buckets are
            shared between different products
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
          description: "Used to provide information about any other entity with relation
            to the balance, for instance to define customer hierarchy for the
            balance (e.g.: customerId, userId, )"
        totalBalance:
          $ref: "#/components/schemas/Quantity"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Action:
      type: object
      description: an abstract resource. example extensions are BalanceTopup, BalanceDeduct
      required:
        - status
      properties:
        id:
          type: string
          description: Unique Identifier for the resource
        href:
          type: string
          format: uri
          description: A reference to the resource
        confirmationDate:
          type: string
          format: date-time
          description: Date when the deduction was confirmed in the server
        description:
          type: string
          description: Description of the recharge operation
        reason:
          type: string
          description: Text describing the reason for the action/task
        requestedDate:
          type: string
          format: date-time
          description: Date when the deduction request was received in the server
        amount:
          $ref: "#/components/schemas/Quantity"
        bucket:
          $ref: "#/components/schemas/BucketRef"
        channel:
          $ref: "#/components/schemas/ChannelRef"
        logicalResource:
          type: array
          items:
            $ref: "#/components/schemas/LogicalResourceRef"
        partyAccount:
          $ref: "#/components/schemas/PartyAccountRef"
        product:
          type: array
          items:
            $ref: "#/components/schemas/ProductRef"
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
          description: Used to provide information about any other entity with relation to
            the operation
        requestor:
          $ref: "#/components/schemas/RelatedParty"
        status:
          $ref: "#/components/schemas/ActionStatusType"
        usageType:
          $ref: "#/components/schemas/UsageType"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
