    GeographicSubAddress:
      type: object
      description: >-
        Representation of a GeographicSubAddress 

        It is used for addressing within a property in an urban area (country properties are often defined differently). It may refer to a building, a building cluster, or a floor of a multistory building.
      properties:
        id:
          type: string
          description: Unique Identifier of the subAddress
        href:
          type: string
          format: uri
          description: Link to the subAddress
        buildingName:
          type: string
          description: allows for buildings that have well-known names
        levelNumber:
          type: string
          description: used where a level type may be repeated e.g. BASEMENT 1, BASEMENT 2
        levelType:
          type: string
          description: describes level types within a building
        name:
          type: string
          description: Name of the subAddress to identify it with a meaningful
            identification
        privateStreetName:
          type: string
          description: private streets internal to a property (e.g. a university) may have
            internal names that are not recorded by the land title office.
        privateStreetNumber:
          type: string
          description: private streets numbers internal to a private street
        subAddressType:
          type: string
          description: "Type of subAddress : it can be a subunit or a private street"
        subUnitNumber:
          type: string
          description: |-
            the discriminator used for the subunit
            often just a simple number e.g. FLAT 5, may also be a range
        subUnitType:
          type: string
          description: |-
            the type of subunit
            e.g.BERTH, FLAT, PIER, SUITE, SHOP, TOWER, UNIT, WHARF
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
