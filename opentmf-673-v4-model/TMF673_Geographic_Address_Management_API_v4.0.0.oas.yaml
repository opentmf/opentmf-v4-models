components:
  schemas:
    Addressable:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    EntityRef:
      type: object
      description: Entity reference schema to be use for all entityRef class.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        name:
          type: string
          description: Name of the related entity.
        "@baseType":
          example: ResourceSpecification
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          example: https://mycsp.com:8080/tmf-api/schema/Resource/LogicalResourceSpecification.schema.json
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          example: LogicalResourceSpecification
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    Extensible:
      type: object
      description: Base Extensible schema for use in TMForum Open-APIs
      properties:
        "@baseType":
          example: ResourceSpecification
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          example: https://mycsp.com:8080/tmf-api/schema/Resource/LogicalResourceSpecification.schema.json
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          example: LogicalResourceSpecification
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    GeographicAddress:
      type: object
      description: >-
        Structured textual way of describing how to find a Property in an urban
        area (country properties are often defined differently).

        Note : Address corresponds to SID UrbanPropertyAddress
      properties:
        id:
          type: string
          description: Unique identifier of the place
        href:
          type: string
          format: uri
          description: Unique reference of the place
        city:
          type: string
          description: City that the address is in
        country:
          type: string
          description: Country that the address is in
        locality:
          type: string
          description: An area of defined or undefined boundaries within a local authority
            or other legislatively defined area, usually rural or semi rural in
            nature. [ANZLIC-STREET], or a suburb, a bounded locality within a
            city, town or shire principally of urban character [ANZLICSTREET]
        name:
          type: string
          description: A user-friendly name for the place, such as [Paris Store], [London
            Store], [Main Home]
        postcode:
          type: string
          description: descriptor for a postal delivery area, used to speed and simplify
            the delivery of mail (also know as zipcode)
        stateOrProvince:
          type: string
          description: the State or Province that the address is in
        streetName:
          type: string
          description: Name of the street or other street type
        streetNr:
          type: string
          description: Number identifying a specific property on a public street. It may
            be combined with streetNrLast for ranged addresses
        streetNrLast:
          type: string
          description: Last number in a range of street numbers allocated to a property
        streetNrLastSuffix:
          type: string
          description: Last street number suffix for a ranged address
        streetNrSuffix:
          type: string
          description: the first street number suffix
        streetSuffix:
          type: string
          description: A modifier denoting a relative direction
        streetType:
          type: string
          description: "alley, avenue, boulevard, brae, crescent, drive, highway, lane,
            terrace, parade, place, tarn, way, wharf "
        geographicLocation:
