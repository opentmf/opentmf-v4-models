servers:
  - url: https://serverRoot/tmf-api/communicationManagement/v4
components:
  schemas:
    Any: {}
    Attachment:
      type: object
      description: Complements the description of an element (for instance a product)
        through video, pictures...
      properties:
        id:
          type: string
          description: Unique identifier for this particular attachment
        href:
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          type: string
          description: Attachment type such as video, picture
        content:
          type: string
          description: The actual contents of the attachment object, if embedded, encoded
            as base64
        description:
          type: string
          description: A narrative text describing the content of the attachment
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and
            document
        name:
          type: string
          description: The name of the attachment
        url:
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: "#/components/schemas/Quantity"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Characteristic:
      type: object
      description: Describes a given characteristic of an object or entity through a
        name/value pair.
      required:
        - name
        - value
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        name:
          type: string
          description: Name of the characteristic
        valueType:
          type: string
          description: Data type of the value of the characteristic
        characteristicRelationship:
          type: array
          items:
            $ref: "#/components/schemas/CharacteristicRelationship"
        value:
          $ref: "#/components/schemas/Any"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CharacteristicRelationship:
      type: object
      description: Another Characteristic that is related to the current Characteristic;
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        relationshipType:
          type: string
          description: The type of relationship
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CommunicationMessage:
      type: object
      description: "Communication message means a notification approach in the format
        of a message which can be dispatched (sent) to the certain user by the
        system with the content which can be felt and understood by the
        recipient. The user can be either a final customer or a customer service
        agent. The message can reach the customer in different interaction
        channels, including: email, short message, mobile app notification
        (push)."
      properties:
        id:
          type: string
          description: Unique identifier of Communication Message
        href:
          type: string
          format: uri
          description: Hypertext Reference of the Communication Message
        content:
          type: string
          description: The content of the communication message
        description:
          type: string
          description: Description for the whole object
        logFlag:
          type: boolean
        messageType:
          type: string
          description: "The type of message, such as: SMS, Email, Mobile app push
            notification"
        priority:
          type: string
          description: |-
            The priority of the communication message.
            Small number means higher priority.
        scheduledSendTime:
          type: string
          format: date-time
          description: The scheduled time for sending the communication message
        sendTime:
          type: string
          format: date-time
          description: The time of sending communication message
        sendTimeComplete:
          type: string
          format: date-time
          description: The time of completion of sending communication message
        subject:
          type: string
          description: The title of the message, necessary for the email and mobile app push
        tryTimes:
          type: integer
          description: How many times do you want to retry the delivery of this message?
        attachment:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
          description: Any attachment associated with this message
        characteristic:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
          description: Any additional characteristic(s) of this message
        receiver:
          type: array
          items:
            $ref: "#/components/schemas/Receiver"
          description: The receiver(s) of this message
        sender:
          $ref: "#/components/schemas/Sender"
        state:
          $ref: "#/components/schemas/CommunicationMessageStateType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CommunicationMessage_Create:
      type: object
      description: >-
        Communication message means a notification approach in the format of a
        message which can be dispatched (sent) to the certain user by the system
        with the content which can be felt and understood by the recipient. The
        user can be either a final customer or a customer service agent. The
        message can reach the customer in different interaction channels,
        including: email, short message, mobile app notification (push).

        Skipped properties: id,href
      required:
        - content
        - receiver
        - sender
        - messageType
      properties:
        content:
          type: string
          description: The content of the communication message
        description:
          type: string
          description: Description for the whole object
        logFlag:
          type: boolean
        messageType:
          type: string
          description: "The type of message, such as: SMS, Email, Mobile app push
            notification"
        priority:
          type: string
          description: |-
            The priority of the communication message.
            Small number means higher priority.
        scheduledSendTime:
          type: string
          format: date-time
          description: The scheduled time for sending the communication message
        sendTime:
          type: string
          format: date-time
          description: The time of sending communication message
        sendTimeComplete:
          type: string
          format: date-time
          description: The time of completion of sending communication message
        subject:
          type: string
          description: The title of the message, necessary for the email and mobile app push
        tryTimes:
          type: integer
          description: How many times do you want to retry the delivery of this message?
        attachment:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
          description: Any attachment associated with this message
        characteristic:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
          description: Any additional characteristic(s) of this message
        receiver:
          type: array
          items:
            $ref: "#/components/schemas/Receiver"
          minItems: 1
          description: The receiver(s) of this message
        sender:
          $ref: "#/components/schemas/Sender"
        state:
          $ref: "#/components/schemas/CommunicationMessageStateType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
