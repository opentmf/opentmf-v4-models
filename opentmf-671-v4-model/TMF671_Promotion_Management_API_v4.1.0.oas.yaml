        action.
      required:
        - actionType
      properties:
        id:
          type: string
          description: Unique identifier.
        actionType:
          type: string
          description: "Action type can be one of the following: voice (minute), data
            (MB), data (GB), SMS, bonus point, physical gift, voucher, promotion
            code, an existing offering, currency."
        actionValue:
          type: string
          description: >-
            When the Promotion type is 1: Award, it means the amount or value of
            the awards decided by actionType, such as: Amount of gift, Amount of
            bonus, Value of discount;  
             • When the Promotion type is 2: Discount, it means the value of the discount;  
