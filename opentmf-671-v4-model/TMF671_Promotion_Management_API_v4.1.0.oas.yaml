    Promotion:
      type: object
      description: Promotion is used to provide the additional discount, voucher,
        bonus or gift to the customer who meets the pre-defined criteria. Using
        promotion, the enterprise is able to attract the users and encourage
        more consumption, especially continuous purchases. Normally Promotion is
        not regarded as one type of product or product offering. It is often
        applied when the customer buys the product offerings with the price or
        amount surpassing the certain limit.
      properties:
        id:
          type: string
          description: Unique identifier of promotion.
        href:
          type: string
          format: uri
          description: Hyperlink to access the promotion.
        description:
          type: string
          description: Details about the purpose of this promotion.
        lastUpdate:
          type: string
          format: date-time
          description: Latest update date of promotion.
        lifecycleStatus:
          type: string
          description: "Value of promotion status. Our suggestion would be:
            draft/test/waitForApproval/release/suspend/retirement."
        name:
          type: string
          description: Name of promotion.
        promotionType:
