    ServiceLevelObjective:
      type: object
      description: >-
        Service level objectives are defined in terms of parameters and metrics,
        thresholds, and tolerances 

        associated with the parameters.
      properties:
        id:
          type: string
          description: The identifier of a service level objectives.
        href:
          type: string
          format: uri
          description: The hyperlink to access a service level objective.
        conformanceComparator:
          type: string
          description: |-
            An operator that specifies whether a Service Level Objective is 
            violated above or below the conformanceTarget.
        conformanceTarget:
          type: string
          description: |-
            A value used to determine if Service Level Objective is met. 
            The data type should be adjusted case by case.
        graceTimes:
          type: string
          description: >-
            The number of times an objective can remain un-updated without 

            a violation of a Service Level Agreement in reference to a measurement period and/or Service Level Agreement reporting period.
        name:
          type: string
          description: The name of the service level objectives.
        thresholdTarget:
          type: string
          description: >-
            A value that used to specify when a warning should be used 

            that indicates an objective is danger of not being met. Notice, the data type should be adjusted case by case.
        toleranceTarget:
          type: string
          description: |-
            A value that specifies the allowable variation of a conformance 
            Target. The data type should be adjusted case by case.
        conformancePeriod:
          $ref: "#/components/schemas/TimePeriod"
        serviceLevelObjectiveConsequence:
          type: array
          items:
            $ref: "#/components/schemas/ServiceLevelSpecConsequence"
          description: A list of consequences for this objective.
        serviceLevelObjectiveParameter:
