      properties:
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    ExternalIdentifier:
      type: object
      description: An identification of an entity that is owned by or originates in a
        software system different from the current system, for example a
        ProductOrder handed off from a commerce platform into an order handling
        system. The structure identifies the system itself, the nature of the
        entity within the system (e.g. class name) and the unique ID of the
        entity within the system. It is anticipated that multiple external IDs
        can be held for a single entity, e.g. if the entity passed through
        multiple systems on the way to the current system. In this case the
        consumer is expected to sequence the IDs in the array in reverse order
        of provenance, i.e. most recent system first in the list.
      required:
        - id
      properties:
        id:
          example: MC2255771199555
          type: string
          description: identification of the entity within the external system.
        href:
          type: string
          format: uri
          description: Hyperlink reference
        externalIdentifierType:
          example: ProductOrder
          type: string
          description: Type of the identification, typically would be the type of the
            entity within the external system
        owner:
          example: MagentoCommerce
          type: string
          description: Name of the external system that owns the entity.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    ImpactType:
      type: string
      description: Possible values for the impact of an Incident
      enum:
        - extensive
        - significant
        - moderate
        - minor
    Incident:
      type: object
      description: An Incident is a record of an event that has altered the
        operational state of a entity (Resource, Service or Customers Product).
        An incident represents an issue that needs to be diagnosed and resolved.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink, a reference to the incident entity
        ackTime:
          example: 2022-03-10T04:01:12Z
          type: string
          format: date-time
          description: The ackTime or acknowledgeTime of the incident. An acknowledged
            incident is being worked on, but is not yet resolved
        category:
          example: BTS Software Fault
          type: string
          description: "The category of the incident  (category is the term used by ITU) "
        clearTime:
          example: 2022-03-10T04:01:12Z
          type: string
          format: date-time
          description: The clear time of the incident
        domain:
          type: string
          description: The domain of the incident, for example RAN, PON, OTN, Cross-Domain
            etc
        incidentDetail:
          type: string
          description: A textual succinct description of the nature, symptoms, cause, or
            effect of the incident.
        incidentResolutionSuggestion:
          type: string
          description: Incident resolution suggestion or tip to resolve the incident
        name:
          type: string
          description: The name of the incident. A short-form string that provides
            succinct, important information about the incident
        occurTime:
          example: 2022-03-10T04:01:12Z
          type: string
          format: date-time
          description: Indicates the time (as a date + time) at which the incident
            occurred at its source
        updateTime:
          example: 2022-03-10T04:01:12Z
          type: string
          description: The last update time  of the incident
        ackState:
          $ref: "#/components/schemas/IncidentAckStateType"
        affectedEntity:
          example: e.g  a ref to a service or resource
          type: array
          items:
            $ref: "#/components/schemas/EntityRef"
          description: "List of affected entities "
        eventId:
          type: array
          items:
            $ref: "#/components/schemas/ResourceEntity"
          description: The correlation event object such as alarm, externalAlarm,
            performance, etc.
        extensionInfo:
