components:
  schemas:
    Addressable:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
    Any: {}
    Characteristic:
      type: object
      description: Describes a given characteristic of an object or entity through a
        name/value pair.
      required:
        - name
        - value
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        name:
          type: string
          description: Name of the characteristic
        valueType:
          type: string
          description: Data type of the value of the characteristic
        characteristicRelationship:
          type: array
          items:
            $ref: "#/components/schemas/CharacteristicRelationship"
        value:
          $ref: "#/components/schemas/Any"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    CharacteristicRelationship:
      type: object
      description: Another Characteristic that is related to the current Characteristic.
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        href:
          type: string
          format: uri
          description: Hyperlink reference
        relationshipType:
          type: string
          description: The type of relationship
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    DiagnoseIncident:
      type: object
      description: >-
        A stage in the incident lifecycle. The purpose of diagnosis is to
        identify a workaround for an incident (ITIL Service Operation). 

        Diagnosing Incidents by Incident SN
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Reference of the diagnose incident task
        errorLog:
          type: string
          description: Reason for failure
        incident:
          $ref: "#/components/schemas/IncidentRef"
        state:
          $ref: "#/components/schemas/TaskStateType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    DiagnoseIncident_Create:
      type: object
      description: >-
