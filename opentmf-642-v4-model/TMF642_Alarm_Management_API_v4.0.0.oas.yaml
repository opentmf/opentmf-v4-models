servers:
  - url: https://serverRoot/tmf-api/alarm/v4
components:
  schemas:
    AckAlarms:
      type: object
      description: Task resource for the acknowledge alarms operation
      properties:
        id:
          type: string
          description: The identifier of the task
        href:
          type: string
          format: uri
          description: A reference to the task
        ackSystemId:
          type: string
          description: Name of the acknowledging system
        ackTime:
          type: string
          format: date-time
          description: Time of the acknowledgement
        ackUserId:
          type: string
          description: Name of the acknowledging user
        state:
          type: string
          description: Current state of the operation task
        ackedAlarm:
          type: array
          items:
            $ref: "#/components/schemas/AlarmRefOrValue"
          description: The successfully acknowledged alarms
        alarmPattern:
          type: array
          items:
            $ref: "#/components/schemas/Alarm"
          description: Alarm patterns to match target alarms. An alarm will match if all
            of the sttributes in any of the patterns compare equal to those
            attributes of the alarm.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    AckAlarms_Create:
      type: object
      description: |-
        Task resource for the acknowledge alarms operation
        Skipped properties: id,href
      required:
        - ackSystemId
        - ackUserId
        - alarmPattern
      properties:
        ackSystemId:
          type: string
          description: Name of the acknowledging system
        ackTime:
          type: string
          format: date-time
          description: Time of the acknowledgement
        ackUserId:
          type: string
          description: Name of the acknowledging user
        state:
          type: string
          description: Current state of the operation task
        ackedAlarm:
          type: array
          items:
            $ref: "#/components/schemas/AlarmRefOrValue"
          description: The successfully acknowledged alarms
        alarmPattern:
          type: array
          items:
            $ref: "#/components/schemas/Alarm"
          minItems: 1
          description: Alarm patterns to match target alarms. An alarm will match if all
            of the sttributes in any of the patterns compare equal to those
            attributes of the alarm.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    AffectedService:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
          format: uri
          description: Provides the identifier of the service affected by the alarm
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Alarm:
      type: object
      description: This resource represents an alarm supporting the information model
        defined in ITU-T X.733.
      properties:
        id:
          type: integer
          description: Identifier of the alarm, determined by the alarm owning system
        href:
          type: string
          format: uri
          description: A reference to the alarm.
        ackState:
          type: string
          description: Provides the Acknowledgement State of the alarm
        ackSystemId:
          type: string
