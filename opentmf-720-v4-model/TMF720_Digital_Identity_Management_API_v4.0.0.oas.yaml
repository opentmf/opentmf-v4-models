components:
  schemas:
    Addressable:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Attachment:
      type: object
      description: Complements the description of an element (for instance a product)
        through video, pictures...
      properties:
        id:
          example: 4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          description: Unique identifier for this particular attachment
        href:
          example: http://host/Attachment/4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          example: video
          type: string
          description: Attachment type such as video, picture
        content:
          type: string
          format: base64
          description: The actual contents of the attachment object, if embedded, encoded
            as base64
        description:
          example: Photograph of the Product
          type: string
          description: A narrative text describing the content of the attachment
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and
            document
        name:
          type: string
          description: The name of the attachment
        url:
          example: http://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: "#/components/schemas/Quantity"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    AttachmentRef:
      type: object
      description: Attachment reference. An attachment complements the description of
        an element (for instance a product) through video, pictures
      properties:
        id:
          type: string
          description: Unique-Identifier for this attachment
        href:
          type: string
          format: uri
          description: URL serving as reference for the attachment resource
        description:
          type: string
          description: A narrative text describing the content of the attachment
        name:
          type: string
          description: Name of the related entity.
        url:
          type: string
          format: uri
          description: Link to the attachment media/content
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    AttachmentRefOrValue:
      type: object
      description: An attachment by value or by reference. An attachment complements
        the description of an element, for example through a document, a video,
        a picture.
      properties:
        id:
          example: 4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          description: Unique identifier for this particular attachment
        href:
          example: http://host/Attachment/4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          example: video
          type: string
          description: Attachment type such as video, picture
        content:
          type: string
          format: base64
          description: The actual contents of the attachment object, if embedded, encoded
            as base64
        description:
          example: Photograph of the Product
          type: string
          description: A narrative text describing the content of the attachment
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and
            document
        name:
          type: string
          description: The name of the attachment
        url:
          example: http://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: "#/components/schemas/Quantity"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
    BiometricCredential:
      type: object
      description: A Credential based on a login and a password.
      properties:
        id:
          type: string
          description: an identifier for a credential/authentification method for this
            digital identity
        biometricSubType:
          type: string
          description: "a biometric sub type when required like for finger: thumb, index,
            ring , pinkyFinger, etc "
        biometricType:
          type: string
          description: "a biometric type like finger, iris, face, etc... "
        state:
          type: string
          description: Used to indicate the current lifecycle state of this credential
            (like active, inactive, expired).
        trustLevel:
          type: string
          description: A level of assurance associated with this credential - this could
            be used to limit/allow specific permission based on this trust
            level.
        attachment:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentRefOrValue"
          description: List of attachment(s) associated with this biometric data.
        contactMedium:
          type: array
