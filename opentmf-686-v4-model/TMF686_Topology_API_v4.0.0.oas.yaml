        A VertexSpecification is a base class that represents a generic means for implementing a particular type of Vertex. In essence, a VertexSpecification defines the common attributes and relationships of a set of related Vertices, while Vertex defines a specific instance that is based on a particular VertexSpecification.

        Skipped properties: id,href
      properties:
        description:
          type: string
          description: Description of this REST resource
        lastUpdate:
          type: string
          format: date-time
          description: Date and time of the last update of this REST resource
        lifecycleStatus:
          type: string
          description: Used to indicate the current lifecycle status of the vertex
            specification
        name:
          type: string
          description: Name given to this REST resource
        version:
          type: string
          description: Vertex Specification version
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
          description: A related party defines party or party role linked to a specific
            entity.
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        vertexSpecCharacteristic:
          type: array
          items:
            $ref: "#/components/schemas/VertexSpecificationCharacteristic"
          description: A characteristic quality or distinctive feature of a
            VertexSpecification.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    VertexSpecificationCharacteristic:
      type: object
      description: This class defines the characteristic features of a vertex
        specification. Every VertexSpecification has a variety of important
        attributes, methods, constraints, and relationships, which distinguish a
        vertex specification from other vertex specifications.
      properties:
        id:
          type: string
          description: Unique ID for the characteristic
        configurable:
          type: boolean
          description: If true, the Boolean indicates that the target Characteristic is
            configurable
        description:
          type: string
          description: A narrative that explains the CharacteristicSpecification.
        extensible:
          type: boolean
          description: An indicator that specifies that the values for the characteristic
            can be extended by adding new values when instantiating a
            characteristic for a resource.
        isUnique:
          type: boolean
          description: Specifies if the value of this characteristic is unique across all
            entities instantiated from the specification that uses this
            characteristc. For example, consider a ProductSpecification for a
            set-top box, with a CharacteristicSpecification cardID. Each set-top
            box must have a different value for cardID, so this isUnique
            attribute would be set to true for the characteristic.
        maxCardinality:
          type: integer
          description: The maximum number of instances a CharacteristicValue can take on.
            For example, zero to five phone numbers in a group calling plan,
            where five is the value for the maxCardinality.
        minCardinality:
          type: integer
          description: The minimum number of instances a CharacteristicValue can take on.
            For example, zero to five phone numbers in a group calling plan,
            where zero is the value for the minCardinality.
        name:
          type: string
          description: A word, term, or phrase by which this characteristic specification
            is known and distinguished from other characteristic specifications.
        regex:
          type: string
          description: A rule or principle represented in regular JsonLdExpression used to
            derive the value of a characteristic value.
        valueType:
          type: string
          description: A kind of value that the characteristic can take on, such as
            numeric, text and so forth
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        vertexSpecCharRelationship:
          type: array
          items:
            $ref: "#/components/schemas/VertexSpecificationCharacteristicRelationship"
          description: An aggregation, migration, substitution, dependency or exclusivity
            relationship between/among Specification Characteristics.
        vertexSpecCharacteristicValue:
          type: array
          items:
            $ref: "#/components/schemas/CharacteristicValueSpecification"
          description: A CharacteristicValueSpecification object is used to define a set
            of attributes, each of which can be assigned to a corresponding set
            of attributes in a VertexSpecificationCharacteristic object. The
            values of the attributes in the CharacteristicValueSpecification
            object describe the values of the attributes that a corresponding
            VertexSpecificationCharacteristic object can take on.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@valueSchemaLocation":
          type: string
          description: This (optional) field provides a link to the schema describing the
            value type.
