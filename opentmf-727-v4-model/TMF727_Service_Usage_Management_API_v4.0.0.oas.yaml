            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    ServiceUsage_Create:
      type: object
      description: >-
        An occurrence of usage on a Service derived from various Resource
        usages, which can be used for determining the Product usage. It is
        comprised of characteristics, which represent attributes of service
        usage.

        Skipped properties: id,href
      required:
        - status
      properties:
        description:
          example: Voicemail Retrieved, Feature added
          type: string
          description: Description of service usage
        usageDate:
          example: 2020-09-21T09:13:16-07:00
