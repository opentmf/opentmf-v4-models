    ServiceUsage:
      type: object
      description: An occurrence of usage on a Service derived from various Resource
        usages, which can be used for determining the Product usage. It is
        comprised of characteristics, which represent attributes of service
        usage.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        description:
          example: Voicemail Retrieved, Feature added
          type: string
          description: Description of service usage
        usageDate:
          example: 2020-09-21T09:13:16-07:00
          type: string
          format: date-time
          description: Date of usage
        usageType:
          type: string
          description: Type of usage
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
        service:
          $ref: "#/components/schemas/ServiceRef"
        status:
          $ref: "#/components/schemas/ServiceUsageStatusType"
