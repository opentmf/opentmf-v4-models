        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    ServiceUsage_Update:
      type: object
      description: >-
        An occurrence of usage on a Service derived from various Resource
