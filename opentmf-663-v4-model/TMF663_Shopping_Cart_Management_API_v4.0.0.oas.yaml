components:
  schemas:
    AgreementItemRef:
      type: object
      description: Agreement reference. An agreement represents a contract or
        arrangement, either written or verbal and sometimes enforceable by law,
        such as a service level agreement or a customer price agreement. An
        agreement involves a number of other business entities, such as
        products, services, and resources and/or their specifications.
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        agreementItemId:
          type: string
          description: Identifier of the agreement
        name:
          type: string
          description: Name of the related entity.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    Any: {}
    BillingAccountRef:
      type: object
      description: BillingAccount reference. A BillingAccount is a detailed
        description of a bill structure.
      properties:
        id:
          type: string
          description: Unique identifier of the billing account
        href:
          type: string
          format: uri
          description: Reference of the billing account
        name:
          type: string
          description: Name of the billing account
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    CartItem:
      type: object
      description: An identified part of the shopping cart. A shopping cart  is
        decomposed into one or more shopping cart item. Cart item represents a
        product offering or bundled product offering that user wish to purchase,
        as well as the pricing of the product offering, reference to product in
        case of configured characteristic or installation address. Cart items
        can be related to other cart item to related bundled offerings or
        reference cart Items to a shipping options
      properties:
        id:
          type: string
          description: Identifier of the cart item (generally it is a sequence number 01,
            02, 03, ...) in the shopping cart
        quantity:
          type: integer
          description: Quantity of cart items
        ItemTotalPrice:
          type: array
          items:
            $ref: "#/components/schemas/CartPrice"
        action:
          $ref: "#/components/schemas/CartItemActionType"
        cartItem:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        cartItemRelationship:
          type: array
          items:
            $ref: "#/components/schemas/CartItemRelationship"
        itemPrice:
          type: array
          items:
            $ref: "#/components/schemas/CartPrice"
        itemTerm:
          type: array
          items:
            $ref: "#/components/schemas/CartTerm"
        note:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        product:
          $ref: "#/components/schemas/ProductRefOrValue"
        productOffering:
          $ref: "#/components/schemas/ProductOfferingRef"
        status:
          $ref: "#/components/schemas/CartItemStatusType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CartItemActionType:
      type: string
      description: action to be performed on the product
      enum:
        - add
        - modify
        - delete
        - noChange
    CartItemRelationship:
      type: object
      description: Relationship among cart items mainly other than hierarchical
        relationships such as "RelyOn", "DependentOn", "Shipping" etc.
      properties:
        id:
          type: string
          description: Unique identifier of the referred cart item
        relationshipType:
          type: string
          description: Type of the cart item relationship
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CartItemStatusType:
      type: string
      description: Possible values for the status of the cart item
      enum:
        - active
        - saveForLater
    CartPrice:
      type: object
      description: An amount, usually of money, that represents the actual price paid
        by the customer for this item. May represent the total price of the
        shopping cart or the total of the cart item depending on the relation
      properties:
        description:
          type: string
          description: A narrative that explains in detail the semantics of this order
            item price.
        name:
          type: string
          description: A short descriptive name such as "Subscription price".
        priceType:
          type: string
          description: A category that describes the price, such as recurring, discount,
            allowance, penalty, and so forth
        recurringChargePeriod:
          type: string
          description: Could be month, week...
        unitOfMeasure:
          type: string
          description: Could be minutes, GB...
        price:
          $ref: "#/components/schemas/Price"
        priceAlteration:
          type: array
          items:
            $ref: "#/components/schemas/PriceAlteration"
        productOfferingPrice:
          $ref: "#/components/schemas/ProductOfferingPriceRef"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CartTerm:
      type: object
      properties:
        description:
          type: string
        name:
          type: string
        duration:
          $ref: "#/components/schemas/Quantity"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Characteristic:
      type: object
      description: Describes a given characteristic of an object or entity through a
        name/value pair.
      required:
        - name
        - value
      properties:
        name:
          type: string
          description: Name of the characteristic
        valueType:
          type: string
          description: Data type of the value of the characteristic
        value:
          $ref: "#/components/schemas/Any"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    ContactMedium:
      type: object
      description: Indicates the contact medium that could be used to contact the party.
      properties:
        mediumType:
          type: string
          description: "Type of the contact medium, such as: email address, telephone
            number, postal address"
        preferred:
          type: boolean
