servers:
  - url: https://serverRoot/tmf-api/resourceOrderingManagement/v4
components:
  schemas:
    Any: {}
    AppointmentRef:
      type: object
      description: Refers an appointment, such as a Customer presentation or internal
        meeting or site visit
      properties:
        id:
          type: string
          description: The identifier of the referred appointment
        href:
          type: string
          format: uri
          description: The reference of the appointment
        description:
          type: string
          description: An explanatory text regarding the appointment made with a party
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for disambiguation
      required:
        - id
    Attachment:
      type: object
      description: Complements the description of an element (for instance a product)
        through video, pictures...
      properties:
        id:
          type: string
          description: Unique identifier for this particular attachment
        href:
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          type: string
          description: Attachment type such as video, picture
        description:
          type: string
          description: A narrative text describing the content of the attachment
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and
            document
        name:
          type: string
          description: The name of the attachment
        url:
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: "#/components/schemas/Quantity"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    AttachmentRef:
      type: object
      description: Attachment reference. An attachment complements the description of
        an element (for instance a product) through video, pictures
      properties:
        id:
          type: string
          description: Unique-Identifier for this attachment
        href:
          type: string
          format: uri
          description: URL serving as reference for the attachment resource
        description:
          type: string
          description: A narrative text describing the content of the attachment
        name:
          type: string
          description: Name of the related entity.
        url:
          type: string
          format: uri
          description: Link to the attachment media/content
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    AttachmentRefOrValue:
      type: object
      description: An attachment by value or by reference.
      properties:
        id:
          type: string
          description: Unique identifier for this particular attachment
        href:
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          type: string
          description: Attachment type such as video, picture
        description:
          type: string
          description: A narrative text describing the content of the attachment
        isRef:
          default: true
          type: boolean
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and
            document
        name:
          type: string
          description: The name of the attachment
        url:
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: "#/components/schemas/Quantity"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
    CancelOrder:
      type: object
      description: A Order cancel is a type of task which  can  be used to place a
        request to cancel an order
      properties:
        id:
          type: string
          description: id of the cancellation request (this is not an order id)
        href:
          type: string
          format: uri
          description: Hyperlink to access the cancellation request
        cancellationReason:
          type: string
          description: Reason why the order is cancelled.
        effectiveCancellationDate:
          type: string
          format: date-time
          description: Date when the order is cancelled.
        requestedCancellationDate:
          type: string
          format: date-time
          description: Date when the submitter wants the order to be cancelled
        state:
          $ref: "#/components/schemas/TaskStateType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CancelResourceOrder:
      type: object
      description: Request for cancellation an existing resource order
      required:
        - resourceOrder
      properties:
        id:
          type: string
          description: id of the cancellation request (this is not an order id)
        href:
          type: string
          format: uri
          description: Hyperlink to access the cancellation request
        cancellationReason:
          type: string
          description: Reason why the order is cancelled.
        effectiveCancellationDate:
          type: string
          format: date-time
          description: Date when the order is cancelled.
        requestedCancellationDate:
          type: string
          format: date-time
          description: Date when the submitter wants the order to be cancelled
        resourceOrder:
          $ref: "#/components/schemas/ResourceOrderRef"
        state:
          $ref: "#/components/schemas/TaskStateType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CancelResourceOrder_Create:
      type: object
      description: |-
        Request for cancellation an existing resource order
        Skipped properties: id,href,state,effectiveCancellationDate
      required:
        - resourceOrder
      properties:
        cancellationReason:
          type: string
          description: Reason why the order is cancelled.
        requestedCancellationDate:
          type: string
          format: date-time
          description: Date when the submitter wants the order to be cancelled
        resourceOrder:
          $ref: "#/components/schemas/ResourceOrderRef"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Characteristic:
      type: object
      description: Describes a given characteristic of an object or entity through a
        name/value pair.
      required:
        - name
        - value
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        name:
          type: string
          description: Name of the characteristic
        valueType:
          type: string
          description: Data type of the value of the characteristic
        characteristicRelationship:
          type: array
          items:
            $ref: "#/components/schemas/CharacteristicRelationship"
        value:
          $ref: "#/components/schemas/Any"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    CharacteristicRelationship:
      type: object
      description: Another Characteristic that is related to the current Characteristic;
      properties:
        id:
          type: string
          description: Unique identifier of the characteristic
        relationshipType:
          type: string
          description: The type of relationship
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    EntityRef:
      type: object
      description: Entity reference schema to be use for all entityRef class.
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        name:
          type: string
          description: Name of the related entity.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    ExternalId:
      type: object
      description: An identification of an entity that is owned by or originates in a
        software system different from the current system, for example a
        ProductOrder handed off from a commerce platform into an order handling
        system. The structure identifies the system itself, the nature of the
        entity within the system (e.g. class name) and the unique ID of the
        entity within the system. It is anticipated that multiple external IDs
        can be held for a single entity, e.g. if the entity passed through
        multiple systems on the way to the current system. In this case the
        consumer is expected to sequence the IDs in the array in reverse order
        of provenance, i.e. most recent system first in the list.
      required:
        - entityType
        - id
        - owner
      properties:
        id:
          type: string
          description: ID of the entity within the external system.
        entityType:
          type: string
          description: Type of the entity within the external system
        owner:
          type: string
          description: Name of the external system that owns the entity.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Note:
      type: object
      description: Extra information about a given entity
      properties:
        id:
          type: string
          description: Identifier of the note within its containing entity (may or may not
            be globally unique, depending on provider implementation)
        author:
          type: string
          description: Author of the note
        date:
          type: string
          format: date-time
          description: Date of the note
        text:
          type: string
          description: Text of the note
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Place:
      type: object
      description: Place reference. Place defines the places where the products are
        sold or delivered.
      properties:
        id:
          type: string
          description: Unique identifier of the place
        href:
          type: string
          format: uri
          description: Unique reference of the place
        name:
          type: string
          description: A user-friendly name for the place, such as [Paris Store], [London
            Store], [Main Home]
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    PlaceRef:
      type: object
      description: Place reference. PlaceRef defines the placeRefs where the products
        are sold or delivered.
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        name:
          type: string
          description: Name of the related entity.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    Quantity:
      type: object
      description: An amount in a given unit
      properties:
        amount:
          default: 1
          type: number
          format: float
          description: Numeric value in a given unit
        units:
          type: string
          description: Unit
    RelatedParty:
      type: object
      description: Related Entity reference. A related party defines party or party
        role linked to a specific entity.
      required:
        - "@referredType"
        - id
      properties:
        id:
          type: string
          description: Unique identifier of a related entity.
        href:
          type: string
          format: uri
          description: Reference of the related entity.
        name:
          type: string
          description: Name of the related entity.
        role:
          type: string
          description: Role played by the related party
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
    RelatedPlaceRefOrValue:
      type: object
      description: Related Entity reference. A related place defines a place described
        by reference or by value linked to a specific entity. The polymorphic
        attributes @type, @schemaLocation & @referredType are related to the
        place entity and not the RelatedPlaceRefOrValue class itself
      required:
        - role
      properties:
        id:
          type: string
          description: Unique identifier of the place
        href:
          type: string
          format: uri
          description: Unique reference of the place
        name:
          type: string
          description: A user-friendly name for the place, such as [Paris Store], [London
            Store], [Main Home]
        role:
          type: string
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
    Resource:
      type: object
      description: Resource is an abstract entity that describes the common set of
        attributes shared by all concrete resources (e.g. TPE, EQUIPMENT) in the
        inventory.
      required:
        - href
        - id
      properties:
        id:
          type: string
          description: Identifier of an instance of the resource. Required to be unique
            within the resource type.  Used in URIs as the identifier for
            specific instances of a type.
        href:
          type: string
          format: uri
          description: The URI for the object itself.
        category:
          type: string
          description: Category of the concrete resource. e.g Gold, Silver for MSISDN
            concrete resource
        description:
          type: string
          description: free-text description of the resource
        endOperatingDate:
          type: string
          format: date-time
          description: A date time( DateTime). The date till the resource is operating
        name:
          type: string
          description: A string used to give a name to the resource
        resourceVersion:
          type: string
          description: A field that identifies the specific version of an instance of a
            resource.
        startOperatingDate:
          type: string
          format: date-time
          description: A date time( DateTime). The date from which the resource is operating
        administrativeState:
          $ref: "#/components/schemas/ResourceAdministrativeStateType"
        attachment:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentRefOrValue"
        note:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        operationalState:
          $ref: "#/components/schemas/ResourceOperationalStateType"
        place:
          $ref: "#/components/schemas/RelatedPlaceRefOrValue"
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
        resourceCharacteristic:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
        resourceRelationship:
          type: array
          items:
            $ref: "#/components/schemas/ResourceRelationship"
        resourceSpecification:
          $ref: "#/components/schemas/ResourceSpecificationRef"
        resourceStatus:
          $ref: "#/components/schemas/ResourceStatusType"
        usageState:
          $ref: "#/components/schemas/ResourceUsageStateType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    ResourceAdministrativeStateType:
      type: string
      description: ResourceAdministrativeStateType enumerations
      enum:
        - locked
        - unlocked
        - shutdown
    ResourceOperationalStateType:
      type: string
      description: ResourceOperationalStateType enumerations
      enum:
        - enable
        - disable
    ResourceOrder:
      type: object
      description: A Resource Order is a request to provision a set of Resources
        (logical and physical) triggered by the request to provision a Service
        through a Service Order
      properties:
        id:
          type: string
          description: Identifier of an instance of the Resource Order. Required to be
            unique within the resource type.  Used in URIs as the identifier for
            specific instances of a type.
        href:
          type: string
          format: uri
          description: Hyperlink to access the order
        category:
          type: string
          description: Used to categorize the order from a business perspective that can
            be useful for the OM system.
        completionDate:
          type: string
          format: date-time
          description: Date when the order was completed
        description:
          type: string
          description: free-text description of the Resource Order
        expectedCompletionDate:
          type: string
          format: date-time
          description: Date when the order was completed
        externalId:
          type: string
          description: "DEPRECATED: Use externalReference Instead. ID given by the
            consumer (to facilitate searches afterwards)"
        name:
          type: string
          description: A string used to give a name to the Resource Order
        orderDate:
          type: string
          format: date-time
          description: Date when the order was created
        orderType:
          type: string
          description: Name of the Resource Order type
        priority:
          type: integer
          description: "A way that can be used by consumers to prioritize orders in OM
            system (from 0 to 4 : 0 is the highest priority, and 4 the lowest)"
        requestedCompletionDate:
          type: string
          format: date-time
