    MeasureThresholdRuleViolation:
      type: object
      description: >-
        A measureThresholdRuleViolation is a violation of a rule that defines
        the in the 

        MericDefMeasureThresholdRule.
      properties:
        conformanceComparatorExact:
          type: boolean
          description: >-
            An operator that when applied on a value specifies whether it 

            is the same target value or not. This operator is used to compare with the conformanceTargetExact if used.
        conformanceComparatorLower:
          type: string
          description: >-
            An operator that when applied on a value specifies whether a 

            threshold is crossed or ceased to be crossed. This operator is used to compare with the conformanceTargetLower if used.
        conformanceComparatorUpper:
          type: string
          description: >-
            An operator that when applied on a value specifies whether a 

            threshold is crossed or ceased to be crossed. This operator is used to compare with the conformanceTargetUpper if used.
        conformanceTargetExact:
          type: string
          description: To cater for values that are not numerical test metrics (e.g. a DSL
            line can be Synchronised or Unsynchronised. If the latter, the test
            should result in a rule violation).The allowed value can contain a
            REGEX expression.
        conformanceTargetLower:
          type: string
          description: >-
            A value used to determine if the threshold is crossed or ceases 

            to be crossed. It represents the lower limit. The value should be less than the conformanceTargetUpper if used. The conformance comparators should also be logically defined so as to not lead to a logically impossible condition.
        conformanceTargetUpper:
          type: string
          description: >-
            A value used to determine if the threshold is crossed or ceases 

            to be crossed. It represents the Upper limit. The value should be greater than the conformanceTargetLower if used. The conformance comparators should also be logically defined so as to not lead to a logically impossible condition.
        description:
          type: string
          description: Description for the MetricDefMeasureThresholdRule .
        name:
          type: string
          description: Name for the MetricDefMeasureThresholdRule .
        numberOfAllowedCrossing:
          type: integer
          description: |-
            The number of allowed crossing occurrences in reference to the 
            tolerancePeriod without a consequence being initiated.
        thresholdRuleSeverity:
          type: string
          description: >-
            A threshold can be generated in different severity levels. A 

            crossing for each level may require a different condition and possibly trigger a different consequence.
        appliedConsequence:
          type: array
          items:
            $ref: "#/components/schemas/AppliedConsequence"
          description: An Applied Consequence defines the action (prescribed action or
            notification) to take when a MeasureThresholdRuleViolation occurs.
        tolerancePeriod:
          $ref: "#/components/schemas/Duration"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    MetricDefMeasureConsequence:
      type: object
      description: >-
        A MetricDefMeasureConsequence defines the action (prescribed action or
        notification) to take when a 

        MetricDefMeasureThresholdRule is crossed.
      properties:
        description:
          type: string
          description: A narrative that explains in detail what the consequence is.
        name:
          type: string
          description: >-
            A word, term, or phrase by which a 

            MetricDefMeasureConsequence is known and distinguished from other MetricDefMeasureConsequences.
        prescribeAction:
          type: string
          description: |-
            Recommended remedy for a violated threshold. This could be 
            the hyperlink to the action.
        repeatAction:
          type: boolean
          description: >-
            An indicator used to specify that a consequence should cease 

            being applied if a value is in the same range as the previous value or continue being applied if a value is in the same range as the previous value. 

            If the repeatAction is True, if the consequence is always applied as soon as the MetricMeasure value is in the range of values and if the repeatAction is False, the consequence is applied only if the previous MetricMeasure value was not in the same range.
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    MetricDefMeasureThresholdRule:
      type: object
      description: >-
        A MetricDefMeasureThresholdRule is a rule that defines the condition
        (raise or clear) to achieve to apply 

        consequences when a threshold is crossed or ceased to be crossed. It also defines the severity of the 

        raise or clear of the threshold.
      properties:
        conformanceComparatorExact:
          type: boolean
          description: >-
            An operator that when applied on a value specifies whether the 

            value is the same or not. This operator is used to compare with the conformanceTargetExact if used.
        conformanceComparatorLower:
          type: string
          description: >-
            An operator that when applied on a value specifies whether a 

            threshold is crossed or ceased to be crossed. This operator is used to Service Test Management API REST Specification compare with the conformanceTargetLower if used.
        conformanceComparatorUpper:
          type: string
          description: >-
            An operator that when applied on a value specifies whether a 

            threshold is crossed or ceased to be crossed. This operator is used to compare with the conformanceTargetUpper if used.
        conformanceTargetExact:
          type: string
          description: To cater for values that are not numerical test metrics (e.g. a DSL
            line can be Synchronised or Unsynchronised. If the latter, the test
            should result in a rule violation). The allowed value can contain a
            REGEX expression.
        conformanceTargetLower:
          type: string
          description: >-
            A value used to determine if the threshold is crossed or ceases 

            to be crossed. It represents the lower limit. The value should be less than the conformanceTargetUpper if used. The conformance comparators should also be logically defined so as to not lead to a logically impossible condition.
        conformanceTargetUpper:
          type: string
          description: >-
            A value used to determine if the threshold is crossed or ceases 

            to be crossed. It represents the Upper limit. The value should be greater than the conformanceTargetLower if used. The conformance comparators should also be logically defined so as to not lead to a logically impossible condition.
        description:
          type: string
          description: Description for the MetricDefMeasureThresholdRule .
        name:
          type: string
          description: Name for the MetricDefMeasureThresholdRule .
        numberOfAllowedCrossing:
          type: integer
          description: |-
            The number of allowed crossing occurrences in reference to the 
            tolerancePeriod without a consequence being initiated.
        thresholdRuleSeverity:
          type: string
          description: >-
            A threshold can be generated in different severity levels. A 

            crossing for each level may require a different condition and possibly trigger a different consequence.
        consequence:
          type: array
          items:
            $ref: "#/components/schemas/MetricDefMeasureConsequence"
          description: A list of consequences (actions, notifications) that will arise if
            the threshold is crossed
        tolerancePeriod:
          $ref: "#/components/schemas/Duration"
