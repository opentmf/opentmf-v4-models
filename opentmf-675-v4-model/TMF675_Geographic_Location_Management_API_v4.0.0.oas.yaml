servers:
  - url: https://serverRoot/tmf-api/geographicLocation/v4
components:
  schemas:
    GeographicLocation:
      type: object
      description: A GeographicLocation is a pure-virtual super-class to the
        GeoJSON-aligned geometries of Point (addresses and locations),
        MultiPoint, LineString (streets, highways and boundaries),
        MultiLineString and Polygon (countries, provinces, tracts of land). Use
        the @type attribute to specify which of these is being specified by the
        geometry attribute.
      properties:
        id:
          type: string
          description: Unique identifier of the geographic location
        href:
          type: string
          format: uri
          description: An URI used to access to the geographic location resource
        "@type":
          type: string
          enum:
            - GeoJsonPoint
            - GeoJsonMultiPoint
            - GeoJsonLineString
            - GeoJsonMultiLineString
            - GeoJsonPolygon
          description: The name of the GeoJSON structure used in the geometry attribute
        bbox:
          type: array
          description: A bounding box array that contains the geometry. The axes order
            follows the axes order of the geometry
          items:
            type: number
      allOf:
        - $ref: "#/components/schemas/Place"
      required:
        - "@type"
    GeographicLocation_Create:
      type: object
      description: >-
        A GeographicLocation is a pure-virtual super-class to the
        GeoJSON-aligned geometries of Point (addresses and locations),
        MultiPoint, LineString (streets, highways and boundaries),
        MultiLineString and Polygon (countries, provinces, tracts of land). Use
        the @type attribute to specify which of these is being specified by the
        geometry attribute.

        Skipped properties: id,href
      required:
        - "@type"
      properties:
        name:
          type: string
          description: A user-friendly name for the place, such as [Paris Store], [London
            Store], [Main Home]
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: The name of the GeoJSON structure used in the geometry attribute
    GeographicLocation_Update:
      type: object
      description: >-
        A GeographicLocation is a pure-virtual super-class to the
        GeoJSON-aligned geometries of Point (addresses and locations),
        MultiPoint, LineString (streets, highways and boundaries),
        MultiLineString and Polygon (countries, provinces, tracts of land). Use
        the @type attribute to specify which of these is being specified by the
        geometry attribute.

        Skipped properties: id,href
      required:
        - "@type"
      properties:
        name:
          type: string
          description: A user-friendly name for the place, such as [Paris Store], [London
            Store], [Main Home]
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: The name of the GeoJSON structure used in the geometry attribute
    Place:
      type: object
      description: Place reference. Place defines the places where the products are
        sold or delivered.
      properties:
        id:
          type: string
          description: Unique identifier of the place
        href:
          type: string
          format: uri
          description: Unique reference of the place
        name:
          type: string
          description: A user-friendly name for the place, such as [Paris Store], [London
            Store], [Main Home]
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    EventSubscription:
      type: object
      description: Sets the communication endpoint address the service instance must
        use to deliver notification information
      required:
        - id
        - callback
      properties:
        id:
          type: string
          description: Id of the listener
        callback:
          type: string
          description: The callback being registered.
        query:
          type: string
          description: additional data to be passed
    EventSubscriptionInput:
      type: object
      description: Sets the communication endpoint address the service instance must
        use to deliver notification information
      required:
        - callback
      properties:
        callback:
          type: string
          description: The callback being registered.
        query:
          type: string
          description: additional data to be passed
    GeographicLocationCreateEvent:
      type: object
      description: The notification data structure
      properties:
        id:
          type: string
          description: Identifier of the Process flow
        href:
          type: string
          format: uri
          description: Reference of the ProcessFlow
        eventId:
          type: string
          description: The identifier of the notification.
        eventTime:
          type: string
          format: date-time
          description: Time of the event occurrence.
        eventType:
          type: string
          description: The type of the notification.
        correlationId:
          type: string
          description: The correlation id for this event.
        domain:
          type: string
          description: The domain of the event.
        title:
          type: string
          description: The title of the event.
        description:
          type: string
          description: An explnatory of the event.
        priority:
          type: string
          description: A priority.
        timeOcurred:
          type: string
          format: date-time
          description: The time the event occured.
        event:
          $ref: "#/components/schemas/GeographicLocationCreateEventPayload"
    GeographicLocationCreateEventPayload:
