    ExternalReference:
      type: object
      description: External reference of the individual or reference in other system
      properties:
        externalReferenceType:
          type: string
          description: Type of the external reference
        name:
          type: string
          description: External reference name
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
          format: uri
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Individual:
      type: object
      description: Individual represents a single human being (a man, woman or child).
        The individual can be a customer, an employee or any other person that
        the organization needs to store information about.
      required:
        - id
      properties:
        id:
          type: string
          description: Unique identifier of the organization
        href:
          type: string
          format: uri
          description: Hyperlink to access the organization
        aristocraticTitle:
          type: string
          description: e.g. Baron, Graf, Earl,…
        birthDate:
          type: string
          format: date-time
          description: Birth date
        countryOfBirth:
          type: string
          description: Country where the individual was born
        deathDate:
          type: string
          format: date-time
          description: Date of death
        familyName:
          type: string
          description: Contains the non-chosen or inherited name. Also known as last name
            in the Western context
        familyNamePrefix:
          type: string
          description: Family name prefix
        formattedName:
          type: string
          description: A fully formatted name in one string with all of its pieces in
            their proper place and all of the necessary punctuation. Useful for
            specific contexts (Chinese, Japanese, Korean,…)
        fullName:
          type: string
          description: Full name flatten (first, middle, and last names)
        gender:
          type: string
          description: Gender
        generation:
          type: string
          description: e.g.. Sr, Jr, III (the third),…
        givenName:
          type: string
          description: First name of the individual
        legalName:
          type: string
          description: Legal name or birth name (name one has for official purposes)
        location:
          type: string
          description: Temporary current location od the individual (may be used if the
            individual has approved its sharing)
        maritalStatus:
          type: string
          description: Marital status (married, divorced, widow ...)
        middleName:
          type: string
          description: Middles name or initial
        nationality:
          type: string
          description: Nationality
        placeOfBirth:
          type: string
          description: Reference to the place where the individual was born
        preferredGivenName:
          type: string
          description: "Contains the chosen name by which the individual prefers to be
            addressed. Note: This name may be a name other than a given name,
            such as a nickname"
        title:
