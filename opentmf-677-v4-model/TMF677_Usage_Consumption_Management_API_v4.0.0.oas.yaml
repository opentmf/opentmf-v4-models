openapi: 3.0.0
info:
  title: API UsageConsumption
  description: >-
    ##TMF API Reference: TMF677 - Usage Consumption


    ### Release: 20.5 - May 2021


    This API covers the consumption levels of products, services or resources related to 0 or more parties. And so, we can search for remaining, global or used bucket values, or for exceptional consumption normally mentioned as out of bucket consumption.


    There are 3 main changes in this API version: Usage Consumption is now described as a TASK resource, Usage Consumption Buckets may be linked between each other (aggregated buckets, bundled buckets, etc), Usage Consumption can be search having in mind services or resources. 

     Copyright © TM Forum 2020. All Rights Reserved
