      description: An amount in a given unit
      properties:
        amount:
          default: 1
          type: number
          format: float
          description: Numeric value in a given unit
        units:
          type: string
          description: Unit
    QueryUsageConsumption:
      type: object
      description: An QueryUsageConsumption allows to manage the calculation request
        of an usage consumption
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
