components:
  schemas:
    Addressable:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
    BalanceActionRef:
      type: object
      description: link to the resource that holds balance-related request information
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        name:
          type: string
          description: Name of the related entity.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    BucketRefOrValue:
      type: object
      description: A bucket (called UsageVolumProduct in the SID Model) represents and
        tracks a quantity of usage (remaining or consumed). It could be either a
        quantity or an amount in a currency. It can represent a fixed number of
        SMS,MMS, call minutes, quantity of data and so on
      properties:
        id:
          type: string
          description: Unique Identifier within the server for the bucket
        href:
          type: string
          format: uri
          description: A resource URI pointing to the resource in the OB that stores the
            detailed information for the bucket
        description:
          type: string
          description: Text describing the contents of the balance managed by the bucket
        isShared:
          type: boolean
          description: True if the bucket is shared between several devices or users
        name:
          type: string
          description: Friendly name to identify the bucket
        remainingValueName:
          type: string
          description: Remaining amount in a formatted string for the bucket given in the
            balance unit (for example 1.9 Gb). This formatted string could be
            used for display needs for example
        status:
          type: string
          description: status for the bucket. active, expired, suspended
        usageType:
          type: string
          description: defines the type of the underlying Balance eg data,voice, any
            currency eg EUR, USD etc
        bucketCounter:
          type: array
          items:
            $ref: "#/components/schemas/ConsumptionSummary"
        bucketRelationship:
          type: array
          items:
            $ref: "#/components/schemas/BucketRelationship"
        logicalResource:
          type: array
          items:
            $ref: "#/components/schemas/UsageConsumptionLogicalResourceRef"
        partyAccount:
          $ref: "#/components/schemas/PartyAccountRef"
        product:
          type: array
          items:
            $ref: "#/components/schemas/UsageConsumptionProductRef"
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
          description: "Used to provide information about any other entity with relation
            to the balance, for instance to define customer hierarchy for the
            balance (e.g.: customerId, userId, )"
        remainingValue:
          $ref: "#/components/schemas/Quantity"
        reserveBalance:
          type: array
          items:
            $ref: "#/components/schemas/ReserveBalanceRef"
        reservedValue:
          $ref: "#/components/schemas/Quantity"
        service:
          type: array
          items:
            $ref: "#/components/schemas/UsageConsumptionServiceRef"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    BucketRelationship:
      type: object
      description: "Linked bucket to the one instantiate, such as [isAggregated] if
        the bucket is a part of other or [aggregator] is the bucket holds others
        "
      required:
        - bucketRefOrValue
        - relationshipType
      properties:
        relationshipType:
          type: string
          description: Type of the bucket relationship, such as [isAggregated] if the
            bucket is a part of other or [aggregator] is the bucket holds others
        bucketRefOrValue:
          $ref: "#/components/schemas/BucketRefOrValue"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    ConsumptionSummary:
      type: object
      description: The consumption counters (called ConsumptionSummary in the SID
        model) detail for example the different kind of consumption done on the
        bucket.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        counterType:
          type: string
          description: Type of the consumption counter. We can give for example a counter
            of the used value for a bucket (counterType=used for example) or the
            value of the consumption done out of the bucket(s)
            (counterType=outOfBucket for example)
        level:
          type: string
          description: Counter level. The counter can be given globally for the bucket or
            detailed by user or by network product for example in case of shared
            bucket
        valueName:
          type: string
          description: Value of the counter in a formatted string used for display needs
            for example
        consumptionPeriod:
          $ref: "#/components/schemas/TimePeriod"
        user:
          $ref: "#/components/schemas/RelatedParty"
        value:
          $ref: "#/components/schemas/Quantity"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    Entity:
