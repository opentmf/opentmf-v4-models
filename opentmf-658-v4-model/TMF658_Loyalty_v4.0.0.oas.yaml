        id:
          type: string
          description: Unique identifier of the account
        href:
          type: string
          format: uri
          description: Unique reference of the account
        accountType:
          type: string
          description: 'A categorization of an account, such as individual, joint, and so forth, whose instances share some
            of the same characteristics. Note: for flexibility we use a String here but an implementation may use an enumeration
            with a limited list of valid values.'
        description:
          type: string
          description: Detailed description of the party account
        lastModified:
          type: string
          format: date-time
          description: Date of last modification of the account
        name:
          type: string
          description: Name of the account
        state:
          type: string
          description: 'Contains the lifecycle state such as: Active, Closed, Suspended and so on.'
        accountBalance:
          type: array
          items:
            $ref: '#/components/schemas/AccountBalance'
        accountRelationship:
          type: array
          items:
            $ref: '#/components/schemas/AccountRelationship'
        contact:
          type: array
          items:
