    TaxDefinition:
      type: object
      description: Reference of a tax definition. A tax is levied by an authorized tax jurisdiction. There are many different
        types of tax (Federal Tax levied by the US Government, State Tax levied by the State of California,…).
      properties:
        id:
          type: string
          description: Unique identifier of the tax.
        jurisdictionLevel:
          example: Country
          type: string
          description: Level of the jurisdiction that levies the tax
        jurisdictionName:
          example: USA
          type: string
          description: Name of the jurisdiction that levies the tax
        name:
          type: string
          description: Tax name.
        taxType:
          example: VAT
          type: string
          description: Type of the tax.
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    TaxExemptionCertificate:
      type: object
      description: A tax exemption certificate represents a tax exemption granted to a party (individual or organization)
        by a tax jurisdiction which may be a city, state, country,... An exemption has a certificate identifier (received
        from the jurisdiction that levied the tax) and a validity period. An exemption is per tax types and determines for
        each type of tax what portion of the tax is exempted (partial by percentage or complete) via the tax definition.
      properties:
        id:
          type: string
          description: Identifier of the tax exemption within list of the exemptions
        certificateNumber:
          type: string
          description: Identifier of a document that shows proof of exemption from taxes for the taxing jurisdiction
        issuingJurisdiction:
          example: USA
          type: string
          description: Name of the jurisdiction that issued the exemption
        reason:
          type: string
          description: Reason for the tax exemption
        attachment:
          $ref: '#/components/schemas/AttachmentRefOrValue'
        taxDefinition:
          type: array
          items:
            $ref: '#/components/schemas/TaxDefinition'
          description: A list of taxes that are covered by the exemption, e.g. City Tax, State Tax. The definition would include
            the exemption (e.g. for a rate exemption 0% would be a full exemption, 5% could be a partial exemption if the
            actual rate was 10%).
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and relationships
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a startDateTime only, or both
      properties:
        endDateTime:
          example: 1985-04-12 23:20:50.520000+00:00
          type: string
          format: date-time
          description: End of the time period, using IETC-RFC-3339 format
        startDateTime:
          example: 1985-04-12 23:20:50.520000+00:00
          type: string
          format: date-time
          description: Start of the time period, using IETC-RFC-3339 format
    Usage:
      type: object
      description: An occurrence of employing a Product, Service, or Resource for its intended purpose, which is of interest
        to the business and can have charges applied to it. It is comprised of characteristics, which represent attributes
        of usage.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        description:
          example: Voicemail Retrieval
          type: string
          description: Description of usage
        usageDate:
          example: 2020-09-21 09:13:16-07:00
          type: string
          format: date-time
          description: Date of usage
        usageType:
          type: string
          description: Type of usage
        ratedProductUsage:
          type: array
          items:
            $ref: '#/components/schemas/RatedProductUsage'
        relatedParty:
          type: array
          items:
            $ref: '#/components/schemas/RelatedParty'
        status:
          $ref: '#/components/schemas/UsageStatusType'
        usageCharacteristic:
          type: array
          items:
            $ref: '#/components/schemas/UsageCharacteristic'
        usageSpecification:
          $ref: '#/components/schemas/UsageSpecificationRef'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class
        '@schemaLocation':
          type: string
          format: uri
