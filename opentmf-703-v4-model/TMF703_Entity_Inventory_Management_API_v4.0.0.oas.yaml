        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    AssociationRole:
      type: object
      description: This embedded object represents the role and type of each entity
        involved in a relationship.
      required:
        - entity
        - role
      properties:
        isSource:
          type: boolean
          description: A flag indicating if the participant involved in a relationship is
            the source or not. If this flag is true for both roles in an
            association, the association is bi-directional (both end points are
            navigable)
        role:
          type: string
          description: The association role of this relationship participant as defined in
            the associationRoleSpecification
        entity:
          $ref: "#/components/schemas/EntityRef"
