servers:
  - url: https://serverRoot/tmf-api/entityInventory/v4
components:
  schemas:
    Addressable:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
    Any: {}
    Association:
      description: Association is the class that describes a relationship between two
        or more entities or entity specifications based on a given association
        specification. The role of each endpoint in the relationship is given by
        an association role. The type of endpoints in the relationship should
        match the ones as defined in the corresponding association role
        specification. A relationship between entity specifications may be
        governed by conditions and rules which are addressed by constraint
        references in this resource. Constraints for a relationship may include
        new rules and conditions in addition to those defined for the
        corresponding association specification
      type: object
      properties:
        description:
          type: string
          description: Description of the association
        lastUpdate:
          type: string
          format: date-time
          description: The last modified date of this association object
        lifecycleStatus:
          type: string
          description: Indicates the current lifecycle status
        name:
          type: string
          description: Name given to this association
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        version:
          type: string
          description: Version of this REST resource
        associationSpec:
          $ref: "#/components/schemas/AssociationSpecificationRef"
        associationRole:
          type: array
          items:
            $ref: "#/components/schemas/AssociationRole"
          minItems: 2
          description: The end point roles of this association
        constraint:
          description: Any constraints in this association
          type: array
          items:
            $ref: "#/components/schemas/ConstraintRef"
        href:
          type: string
          format: uri
          description: Hyperlink reference
        id:
          type: string
          description: unique identifier
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Association_Create:
      type: object
      description: >-
        Association is the class that describes a relationship between two or
        more entities or entity specifications based on a given association
        specification. The role of each endpoint in the relationship is given by
        an association role. The type of endpoints in the relationship should
        match the ones as defined in the corresponding association role
        specification. A relationship between entity specifications may be
        governed by conditions and rules which are addressed by constraint
        references in this resource. Constraints for a relationship may include
        new rules and conditions in addition to those defined for the
        corresponding association specification

        Skipped properties: id,href
      required:
        - name
        - associationRole
      properties:
        description:
          type: string
          description: Description of the association
        lastUpdate:
          type: string
          format: date-time
          description: The last modified date of this association object
        lifecycleStatus:
          type: string
          description: Indicates the current lifecycle status
        name:
          type: string
          description: Name given to this association
        version:
          type: string
          description: Version of this REST resource
        associationRole:
          $ref: "#/components/schemas/AssociationRole"
        associationSpec:
          $ref: "#/components/schemas/AssociationSpecificationRef"
        constraint:
          type: array
          items:
            $ref: "#/components/schemas/ConstraintRef"
          description: Any constraints in this association
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    Association_Update:
      type: object
      description: >-
        Association is the class that describes a relationship between two or
        more entities or entity specifications based on a given association
        specification. The role of each endpoint in the relationship is given by
