          default: false
          type: boolean
          description: When the value is TRUE means that alternative proposal should be
            provided (from other product stock, different date or quantity)
        requestedAvailabilityDate:
          type: string
          format: date-time
          description: Date when the stock availability should be check.
        requestedCheckProductStockDate:
          type: string
          format: date-time
