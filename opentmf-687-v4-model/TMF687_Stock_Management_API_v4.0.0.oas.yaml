servers:
  - url: https://serverRoot/tmf-api/stock/v4
components:
  schemas:
    Addressable:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
    AdjustProductStock:
      type: object
      description: AdjustProductStock is used to log and execute on or several Product
        Stock level change
      required:
        - adjustProductStockItem
      properties:
        id:
          type: string
          description: Unique identifier of the AdjustProductStock
        href:
          type: string
          format: uri
          description: Reference of the AdjustProductStock
        adjustReason:
          type: string
          description: A reason for this product stock adjustment like theft or wastage.
        completedAdjustProductStockDate:
          type: string
          format: date-time
          description: Date when the AdjustProductStock was created (whatever its status).
        creationDate:
          type: string
          format: date-time
          description: Date when the AdjustProductStock was created (whatever its status).
        description:
          type: string
          description: Free-text description of the AdjustProductStock
        instantSyncAdjust:
          type: boolean
          description: An indicator which when the value is "true" means that requester
            expects the adjustment immediately. If the indicator is true then
            the response code of 200 indicates the operation is successful
            otherwise a task is created with a response 201.
        requestedAdjustProductStockDate:
          type: string
          format: date-time
          description: Date when the AdjustProductStock was created (whatever its status).
        adjustProductStockItem:
          type: array
          items:
            $ref: "#/components/schemas/AdjustProductStockItem"
          minItems: 1
        state:
          $ref: "#/components/schemas/TaskStateType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    AdjustProductStock_Create:
      type: object
      description: >-
        AdjustProductStock is used to log and execute on or several Product
        Stock level change

        Skipped properties: id,href
      required:
        - adjustProductStockItem
      properties:
        adjustReason:
          type: string
          description: A reason for this product stock adjustment like theft or wastage.
        completedAdjustProductStockDate:
          type: string
          format: date-time
          description: Date when the AdjustProductStock was created (whatever its status).
        creationDate:
          type: string
          format: date-time
          description: Date when the AdjustProductStock was created (whatever its status).
        description:
          type: string
          description: Free-text description of the AdjustProductStock
        instantSyncAdjust:
          type: boolean
          description: An indicator which when the value is "true" means that requester
            expects the adjustment immediately. If the indicator is true then
            the response code of 200 indicates the operation is successful
            otherwise a task is created with a response 201.
        requestedAdjustProductStockDate:
          type: string
          format: date-time
          description: Date when the AdjustProductStock was created (whatever its status).
        adjustProductStockItem:
          type: array
          items:
            $ref: "#/components/schemas/AdjustProductStockItem"
          minItems: 1
        state:
          $ref: "#/components/schemas/TaskStateType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    AdjustProductStockItem:
      type: object
      description: A list of AdjustProductStock items. Every item is a ProductStock
        adjustement request.
      required:
        - id
        - productStockTarget
        - adjustProductStockQuantity
      properties:
        id:
          type: string
          description: Unique identifier of the AdjustProductStockItem
        href:
          type: string
          format: uri
          description: Hyperlink reference
        adjustProductStockQuantity:
          $ref: "#/components/schemas/Quantity"
        productStockTarget:
          $ref: "#/components/schemas/ProductStockRef"
        state:
          $ref: "#/components/schemas/TaskStateType"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    AgreementItemRef:
      type: object
      description: Agreement reference. An agreement represents a contract or
        arrangement, either written or verbal and sometimes enforceable by law,
        such as a service level agreement or a customer price agreement. An
        agreement involves a number of other business entities, such as
        products, services, and resources and/or their specifications.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        agreementItemId:
          type: string
          description: Identifier of the agreement
        name:
          type: string
          description: Name of the related entity.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
