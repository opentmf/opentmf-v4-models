servers:
  - url: https://serverRoot/tmf-api/metadataCatalog/v4
components:
  schemas:
    Addressable:
      type: object
      description: Base schema for adressable entities
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
    Any: {}
    AssociationSpecificationRef:
      type: object
      description: reference to an AssociationSpecification object
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        name:
          type: string
          description: Name of the related entity.
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    Attachment:
      type: object
      description: Complements the description of an element (for instance a product)
        through video, pictures...
      properties:
        id:
          example: 4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          description: Unique identifier for this particular attachment
        href:
          example: http://host/Attachment/4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          example: video
          type: string
          description: Attachment type such as video, picture
        content:
          type: string
          format: base64
          description: The actual contents of the attachment object, if embedded, encoded
            as base64
        description:
          example: Photograph of the Product
          type: string
          description: A narrative text describing the content of the attachment
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and
            document
        name:
          type: string
          description: The name of the attachment
        url:
          example: http://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: "#/components/schemas/Quantity"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    AttachmentRef:
      type: object
      description: Attachment reference. An attachment complements the description of
        an element (for instance a product) through video, pictures
      properties:
        id:
          type: string
          description: Unique-Identifier for this attachment
        href:
          type: string
          format: uri
          description: URL serving as reference for the attachment resource
        description:
          type: string
          description: A narrative text describing the content of the attachment
        name:
          type: string
          description: Name of the related entity.
        url:
          type: string
          format: uri
          description: Link to the attachment media/content
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    AttachmentRefOrValue:
      type: object
      description: An attachment by value or by reference. An attachment complements
        the description of an element, for example through a document, a video,
        a picture.
      properties:
        id:
          example: 4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          description: Unique identifier for this particular attachment
        href:
          example: http://host/Attachment/4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          format: uri
          description: URI for this Attachment
        attachmentType:
          example: video
          type: string
          description: Attachment type such as video, picture
        content:
          type: string
          format: base64
          description: The actual contents of the attachment object, if embedded, encoded
            as base64
        description:
          example: Photograph of the Product
          type: string
          description: A narrative text describing the content of the attachment
        mimeType:
          type: string
          description: Attachment mime type such as extension file for video, picture and
            document
        name:
          type: string
          description: The name of the attachment
        url:
          example: http://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          format: uri
          description: Uniform Resource Locator, is a web page address (a subset of URI)
        size:
          $ref: "#/components/schemas/Quantity"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
    CharacteristicSpecification:
      type: object
      description: This class defines a characteristic specification.
      properties:
        id:
          type: string
          description: Unique ID for the characteristic
        configurable:
          type: boolean
          description: If true, the Boolean indicates that the target Characteristic is
            configurable
        description:
          type: string
          description: A narrative that explains the CharacteristicSpecification.
        extensible:
          type: boolean
          description: An indicator that specifies that the values for the characteristic
            can be extended by adding new values when instantiating a
            characteristic for a resource.
        isUnique:
          type: boolean
          description: Specifies if the value of this characteristic is unique across all
            entities instantiated from the specification that uses this
            characteristc. For example, consider a ProductSpecification for a
            set-top box, with a CharacteristicSpecification cardID. Each set-top
            box must have a different value for cardID, so this isUnique
            attribute would be set to true for the characteristic.
        maxCardinality:
          type: integer
          description: The maximum number of instances a CharacteristicValue can take on.
            For example, zero to five phone numbers in a group calling plan,
            where five is the value for the maxCardinality.
        minCardinality:
          type: integer
          description: The minimum number of instances a CharacteristicValue can take on.
            For example, zero to five phone numbers in a group calling plan,
            where zero is the value for the minCardinality.
        name:
          type: string
          description: A word, term, or phrase by which this characteristic specification
            is known and distinguished from other characteristic specifications.
        regex:
          type: string
          description: A rule or principle represented in regular expression used to
            derive the value of a characteristic value.
        valueType:
          type: string
          description: A kind of value that the characteristic can take on, such as
            numeric, text and so forth
        charSpecRelationship:
          type: array
          items:
            $ref: "#/components/schemas/CharacteristicSpecificationRelationship"
          description: An aggregation, migration, substitution, dependency or exclusivity
            relationship between/among Specification Characteristics.
        characteristicValueSpecification:
          type: array
          items:
            $ref: "#/components/schemas/CharacteristicValueSpecification"
          description: A CharacteristicValueSpecification object is used to define a set
            of attributes, each of which can be assigned to a corresponding set
            of attributes in a CharacteristicSpecification object. The values of
            the attributes in the CharacteristicValueSpecification object
            describe the values of the attributes that a corresponding
            Characteristic object can take on.
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@valueSchemaLocation":
          type: string
          description: This (optional) field provides a link to the schema describing the
            value type.
