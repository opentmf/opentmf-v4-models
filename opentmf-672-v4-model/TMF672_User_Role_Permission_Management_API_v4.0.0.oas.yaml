components:
  schemas:
    AssetUserRole:
      type: object
      description: The AssetUserRole is the detailed information concerning an
        individual user role
      required:
        - manageableAsset
        - userRole
      properties:
        manageableAsset:
          $ref: "#/components/schemas/EntityRef"
        userRole:
          $ref: "#/components/schemas/UserRoleRef"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
