          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    Permission:
      type: object
      description: The Permission resource represents the entitlement given by an
        individual (granter) to another individual (user) to get access to a set
        of his owned manageable assets. One single permission resource can hold
        information referring to privileges granted for multiple manageable
        assets.
      required:
        - user
        - validFor
      properties:
        id:
          type: string
          description: Unique identifier of the permission
        href:
          type: string
          format: uri
          description: Hypertext Reference of the permission
        creationDate:
          type: string
          format: date-time
          description: Date when the payment was performed
        description:
          type: string
          description: Text describing the contents of the payment
        assetUserRole:
          type: array
          items:
            $ref: "#/components/schemas/AssetUserRole"
        granter:
          $ref: "#/components/schemas/RelatedParty"
        privilege:
          type: array
