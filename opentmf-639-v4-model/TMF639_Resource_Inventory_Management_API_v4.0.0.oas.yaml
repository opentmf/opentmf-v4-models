      description: Linked resources to the one instantiate, such as [bundled] if the
        resource is a bundle and you want to describe the bundled resources
        inside this bundle; [reliesOn] if the resource needs another already
        owned resource to rely on (e.g. an option on an already owned mobile
        access resource) [targets] or [isTargeted] (depending on the way of
        expressing the link) for any other kind of links that may be useful
      required:
        - relationshipType
        - resource
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        relationshipType:
          example: bundled
          type: string
          description: "Type of the resource relationship, such as [bundled] if the
            resource is a bundle and you want to describe the bundled resources
            inside this bundle; [reliesOn] if the resource needs another already
            owned resource to rely on (eg: an option on an already owned mobile
            access resource) [targets] or [isTargeted] (depending on the way of
            expressing the link) for any other kind of links that may be useful"
        resource:
          $ref: "#/components/schemas/ResourceRefOrValue"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    ResourceSpecificationRef:
      type: object
      description: >-
        Resources are physical or non-physical components (or some combination
        of these) within an enterprise's infrastructure or inventory. They are
        typically consumed or used by services (for example a physical port
        assigned to a service) or contribute to the realization of a Product
        (for example, a SIM card). They can be drawn from the Application,
        Computing and Network domains, and include, for example, Network
        Elements, software, IT systems, content and information, and technology
        components.

        A ResourceSpecification is an abstract base class for representing a generic means for implementing a particular type of Resource. In essence, a ResourceSpecification defines the common attributes and relationships of a set of related Resources, while Resource defines a specific instance that is based on a particular ResourceSpecification.
      properties:
        id:
          type: string
          description: unique identifier
        href:
          type: string
          format: uri
          description: Hyperlink reference
        name:
          type: string
          description: Name of the related entity.
        version:
          type: string
          description: Resource Specification version
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
        "@referredType":
          type: string
          description: The actual type of the target instance when needed for
            disambiguation.
      required:
        - id
    ResourceStatusType:
      type: string
      description: ResourceStatusType enumerations
      enum:
        - standby
        - alarm
        - available
        - reserved
        - unknown
        - suspended
    ResourceUsageStateType:
      type: string
      description: ResourceUsageStateType enumerations
      enum:
        - idle
        - active
        - busy
    TimePeriod:
      type: object
      description: A period of time, either as a deadline (endDateTime only) a
        startDateTime only, or both
      properties:
        endDateTime:
          example: 1985-04-12T23:20:50.52Z
          type: string
          format: date-time
          description: End of the time period, using IETC-RFC-3339 format
        startDateTime:
          example: 1985-04-12T23:20:50.52Z
          type: string
          format: date-time
          description: Start of the time period, using IETC-RFC-3339 format
