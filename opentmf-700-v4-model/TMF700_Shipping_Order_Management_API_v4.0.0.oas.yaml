openapi: 3.0.0
info:
  title: API ShippingOrder
  description: >-
    ## TMF API Reference: TMF 700 - Shipping Order 


    ### February 2021

       A Shipping Order is a document used by a business to specify what items are to be transferred by a logisitic partner from a storage location or warehouse to a party in a different location.When goods are sent to the customers, shipment information can be provided to them so they can be aware of when things were shipped and when they will arrive. The service provider creates a Shipping Order which can be sent to a Logistic Partner to manage the physical shipment. The Shipping Order can be split into one or more Shipments with associated  Shipment Tracking to capture information about the current status of the shipment, the past checkpoints and the estimated arrival date .

    Copyright © TM Forum 2018. All Rights Reserved.
