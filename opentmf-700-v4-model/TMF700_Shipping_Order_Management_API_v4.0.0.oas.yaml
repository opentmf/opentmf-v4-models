    ShippingOrder_Update:
      type: object
      description: >-
        A Shipping Order is a document used by a business to specify what items
        are to be transferred from a storage location or warehouse to which
        person and to which new location. A Shipping Order can typically be sent
        along with a shipment of goods so that the person receiving them can
        verify that the document correctly reflects the items that they actually
        received.

        Skipped properties: id,href,creationDate,lastUpdateDate
      properties:
        status:
          example: active
          type: string
          description: status of shipping order e.g "active" , "savedForLater"
        note:
          type: array
          items:
            $ref: "#/components/schemas/Note"
          description: A list of notes made on this shipping shipment
        placeFrom:
          $ref: "#/components/schemas/RelatedPlaceRefOrValue"
        placeTo:
          $ref: "#/components/schemas/RelatedPlaceRefOrValue"
        productOrder:
          $ref: "#/components/schemas/ProductOrderRef"
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedPartyWithContactInfo"
          description: An existing related party that has some form of correlation with
            the given shipping order. It can be recipient, payer, etc.
        relatedShippingOrder:
          $ref: "#/components/schemas/RelatedShippingOrder"
        shippingInstruction:
          $ref: "#/components/schemas/ShippingInstruction"
        shippingOrderCharacteristic:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
          description: List of characteristics with values
        shippingOrderItem:
          type: array
          items:
            $ref: "#/components/schemas/ShippingOrderItem"
          description: A list of shipping order items. Each shipping order item has a
            corresponding Shipment(e.g. parcel) which has one or multiple
            products in it
        shippingOrderOffering:
          $ref: "#/components/schemas/ProductOfferingRef"
        shippingOrderPrice:
          $ref: "#/components/schemas/ProductPrice"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class Extensible name
    ShippingOrderItem:
      type: object
      description: A list of shipping order items
      required:
        - id
        - action
      properties:
        id:
          example: 4aafacbd-11ff-4dc8-b445-305f2215715f
          type: string
          description: Identifier of the Shipping Order Item
        href:
          type: string
          format: uri
          description: Hyperlink reference
        quantity:
          example: 10 units
          type: string
          description: Quantity the individual shipment line item
        status:
          example: active
          type: string
          description: status of shipping order item. e.g "active" , "savedForLater"
        action:
          $ref: "#/components/schemas/ShippingOrderItemActionType"
        placeFrom:
          $ref: "#/components/schemas/RelatedPlaceRefOrValue"
        placeTo:
          $ref: "#/components/schemas/RelatedPlaceRefOrValue"
        product:
          $ref: "#/components/schemas/ProductRef"
        productOffering:
          $ref: "#/components/schemas/ProductOfferingRef"
        productOrderItem:
          $ref: "#/components/schemas/ProductOrderItemRef"
        relatedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedPartyWithContactInfo"
          description: A party which is involved in this shipment and the role they are
            playing and address. In case of shipping to addresses where a geo
            location is needed than then PlaceTo,PlaceFrom can be used.
        shipment:
          $ref: "#/components/schemas/ShipmentRefOrValue"
