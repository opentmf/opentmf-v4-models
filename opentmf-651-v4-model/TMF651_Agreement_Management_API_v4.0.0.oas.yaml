servers:
  - url: https://serverRoot/tmf-api/agreementManagement/v4
components:
  schemas:
    Agreement:
      type: object
      description: An agreement represents a contract or arrangement, either written
        or verbal and sometimes enforceable by law, such as a service level
        agreement or a customer price agreement. An agreement involves a number
        of other business entities, such as products, services, and resources
        and/or their specifications.
      required:
        - agreementItem
        - agreementType
        - engagedParty
        - name
      properties:
        id:
          type: string
          description: Unique identifier for the agreement
        href:
          type: string
          format: uri
          description: Unique url identifying the agreement as a resource
        agreementType:
          type: string
          description: The type of the agreement. For example commercial
        description:
          type: string
          description: Narrative that explains the agreement and details about the it ,
            such as why the agreement is taking place.
        documentNumber:
          type: integer
          description: A reference number assigned to an Agreement that follows a
            prescribed numbering system.
        initialDate:
          type: string
          format: date-time
          description: Date at which the agreement was initialized
        name:
          type: string
          description: A human-readable name for the agreement
        statementOfIntent:
          type: string
          description: An overview and goals of the Agreement
        status:
          type: string
          description: "The current status of the agreement. Typical values are: in
            process, approved and rejected"
        version:
          type: string
          description: A string identifying the version of the agreement
        agreementAuthorization:
          type: array
          items:
            $ref: "#/components/schemas/AgreementAuthorization"
        agreementItem:
          type: array
          items:
            $ref: "#/components/schemas/AgreementItem"
          minItems: 1
        agreementPeriod:
          $ref: "#/components/schemas/TimePeriod"
        agreementSpecification:
          $ref: "#/components/schemas/AgreementSpecificationRef"
        associatedAgreement:
          type: array
          items:
            $ref: "#/components/schemas/AgreementRef"
        characteristic:
          type: array
          items:
            $ref: "#/components/schemas/Characteristic"
        completionDate:
          $ref: "#/components/schemas/TimePeriod"
        engagedParty:
          type: array
          items:
            $ref: "#/components/schemas/RelatedParty"
          minItems: 1
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
