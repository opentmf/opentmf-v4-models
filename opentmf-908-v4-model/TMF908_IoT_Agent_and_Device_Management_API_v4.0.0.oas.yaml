    ResourceSpecCharacteristic:
      type: object
      description: This class represents the key features of this service
        specification. For example, bandwidth is a characteristic of many
        different types of services; if bandwidth is a relevant characteristic
        (e.g., from the point-of-view of a Customer obtaining this Service via a
        Product) then bandwidth would be a ServiceSpecCharacteristic for that
        particular Service.
      properties:
        configurable:
          type: boolean
          description: If true, the Boolean indicates that the serviceSpecCharacteristic
            is configurable
        description:
          type: string
          description: A narrative that explains in detail what the
            serviceSpecCharacteristic is
        extensible:
          type: boolean
          description: An indicator that specifies that the values for the characteristic
            can be extended by adding new values when instantiating a
            characteristic for an Entity.
        isUnique:
          type: boolean
          description: An indicator that specifies if a value is unique for the
            specification. Possible values are; "unique while value is in
            effect" and "unique whether value is in effect or not"
        maxCardinality:
          type: integer
          description: The maximum number of instances a CharacteristicValue can take on.
            For example, zero to five phone numbers in a group calling plan,
            where five is the value for the maxCardinality.
        minCardinality:
          type: integer
          description: The minimum number of instances a CharacteristicValue can take on.
            For example, zero to five phone numbers in a group calling plan,
            where zero is the value for the minCardinality.
        name:
          type: string
          description: A word, term, or phrase by which this characteristic specification
            is known and distinguished from other characteristic specifications.
        regex:
          type: string
          description: A rule or principle represented in regular expression used to
            derive the value of a characteristic value.
        valueType:
          type: string
          description: A kind of value that the characteristic can take on, such as
            numeric, text and so forth
        resourceSpecCharRelationship:
          type: array
          items:
            $ref: "#/components/schemas/ResourceSpecCharRelationship"
          description: A list of resource spec char relationships
            (ResourceSpecCharRelationship [*]). An aggregation, migration,
            substitution, dependency or exclusivity relationship between/among
            Specification Characteristics.
        resourceSpecCharacteristicValue:
          type: array
          items:
            $ref: "#/components/schemas/ResourceSpecCharacteristicValue"
          description: A list of resource spec characteristic values
            (ResourceSpecCharacteristicValue [*]). A
            ResourceSpecCharacteristicValue object is used to define a set of
            attributes, each of which can be assigned to a corresponding set of
            attributes in a ResourceSpecCharacteristic object. The values of the
            attributes in the ResourceSpecCharacteristicValue object describe
            the values of the attributes that a corresponding
            ResourceSpecCharacteristic object can take on.
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
        "@valueSchemaLocation":
          type: string
          description: This (optional) field provides a link to the schema describing the
            value type.
    ResourceSpecCharacteristicValue:
      type: object
      description: A ResourceSpecCharacteristicValue object is used to define a set of
        attributes, each of which can be assigned to a corresponding set of
        attributes in a ResourceSpecCharacteristic object. The values of the
        attributes in the ResourceSpecCharacteristicValue object describe the
        values of the attributes that a corresponding ResourceSpecCharacteristic
        object can take on.
      properties:
        isDefault:
          type: boolean
          description: Indicates if the value is the default value for a characteristic
        rangeInterval:
          type: string
          description: An indicator that specifies the inclusion or exclusion of the
            valueFrom and valueTo attributes. If applicable, possible values are
            "open", "closed", "closedBottom" and "closedTop".
        regex:
          type: string
          description: A regular expression constraint for given value
        unitOfMeasure:
          type: string
          description: A length, surface, volume, dry measure, liquid measure, money,
            weight, time, and the like. In general, a determinate quantity or
            magnitude of the kind designated, taken as a standard of comparison
            for others of the same kind, in assigning to them numerical values,
            as 1 foot, 1 yard, 1 mile, 1 square foot.
        valueFrom:
          type: integer
          description: The low range value that a characteristic can take on
        valueTo:
          type: integer
          description: The upper range value that a characteristic can take on
        valueType:
          type: string
          description: A kind of value that the characteristic can take on, such as
            numeric, text, and so forth
        validFor:
          $ref: "#/components/schemas/TimePeriod"
        value:
          $ref: "#/components/schemas/Any"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
