        id:
          type: string
        href:
          type: string
          format: uri
          description: Provides the identifier of the service affected by the alarm
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Alarm:
      type: object
      description: This resource represents an alarm supporting the information model
        defined in ITU-T X.733.
      properties:
        id:
          type: integer
          description: Identifier of the alarm, determined by the alarm owning system
        href:
          type: string
          format: uri
          description: A reference to the alarm.
        ackState:
          type: string
          description: Provides the Acknowledgement State of the alarm
        ackSystemId:
          type: string
          description: Provides the name of the system that last changed the ackState of
            an alarm, i.e. acknowledged or unacknowledged the alarm.
        ackUserId:
          type: string
          description: Provides the id of the user who has last changed the ack state of
            the alarm, i.e. acknowledged or unacknowledged the alarm.
        alarmChangedTime:
          type: string
          format: date-time
          description: Indicates the last date and time when the alarm is changed on the
            alarm-owning system. Any change to the alarm whether coming from the
            alarmed resource, or triggered by a change from the client is
            changing this time.
        alarmClearedTime:
          type: string
          format: date-time
          description: "Indicates the time (as a date + time) at which the alarm is
            cleared at the source. "
        alarmDetails:
          type: string
          description: Contains further information on the alarm.
        alarmEscalation:
          type: boolean
          description: "Indicates if this alarm has been escalated or not. "
        alarmRaisedTime:
          type: string
          format: date-time
          description: Indicates the time (as a date + time) at which the alarm occurred
            at its source.
        alarmReportingTime:
          type: string
          format: date-time
          description: >-
            Indicates the time (as a date + time) at which the alarm was
            reported by the owning OSS. It might be different from the
            alarmRaisedTime. For instance, if the alarm list is maintained by an
            EMS, the alarmRaisedtime would be the time the alarm
              was detected by the NE, while the alarmReportingTime would be the time this alarm was stored in the alarm list of the EMS.
        alarmType:
          type: string
          description: >-
            Categorize the alarm. Should be one of the values defined in X.733
            8.1.1 or 3GPP TS 32.111-2 Annex A:
            	Communications Alarm
            	Processing Error Alarm
            	Environmental Alarm
            	Quality of Service Alarm
            	Equipment Alarm
            	Integrity Violation
            	Operational Violation
            	Physical Violation
            	Security Service or Mechanism Violation
            	Time Domain Violation
        alarmedObjectType:
          type: string
          description: The type (class) of the managed object associated with the event.
        clearSystemId:
          type: string
          description: "Provides the id of the system where the user who invoked the
            alarmCleared operation is located. "
        clearUserId:
          type: string
          description: Provides the id of the user who invoked the alarmCleared operation
        externalAlarmId:
          type: string
          description: An identifier of the alarm in the source system.
        isRootCause:
          type: boolean
          description: "Indicates whether the alarm is a root cause alarm.. "
        perceivedSeverity:
          type: string
          description: >-
            Lists the possible severities that can be allocated to an Alarm. The
            values are consistent with ITU-T Recommendation X.733.

            Once an alarm has been cleared, its perceived severity is set to 'cleared' and can no longer be set.
        plannedOutageIndicator:
          type: string
          description: "Indicates that the Managed Object (related to this alarm) is in
            planned outage (in planned maintenance, or out-of-service). "
        probableCause:
          type: string
          description: Provides the probable cause of the alarm. The values are consistent
            with ITU-T Recommendation X.733 or 3GPP TS 32.111-2 Annex B.
        proposedRepairedActions:
          type: string
          description: Indicates proposed repair actions, if known to the system emitting
            the alarm.
        reportingSystemId:
          type: string
          description: Reporting system identity.
        serviceAffecting:
          type: boolean
          description: Indicates whether the alarm affects service or not.
        sourceSystemId:
          type: string
          description: Source system identity.
        specificProblem:
          type: string
          description: Provides more specific information about the alarm.
        state:
          type: string
          description: Defines the alarm state during its life cycle
        affectedService:
          type: array
          items:
            $ref: "#/components/schemas/AffectedService"
        alarmedObject:
          $ref: "#/components/schemas/AlarmedObject"
        comment:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        correlatedAlarm:
