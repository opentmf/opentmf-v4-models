    GeoJsonLineString:
      type: object
      description: "Container for GeoJson LineString: A collection of Points forming a
        connected line"
      allOf:
        - $ref: "#/components/schemas/GeographicLocation"
        - type: object
          properties:
            geoJson:
              $ref: "#/components/schemas/LineString"
    GeoJsonMultiLineString:
      type: object
      description: "A container for GeoJSON MultiLineString: A collection of distinct
        LineStrings"
      allOf:
        - $ref: "#/components/schemas/GeographicLocation"
        - type: object
          properties:
            geoJson:
              $ref: "#/components/schemas/MultiLineString"
    GeoJsonMultiPoint:
      type: object
      description: "Container for GeoJSON MultiPoint: A collection of Points"
      allOf:
        - $ref: "#/components/schemas/GeographicLocation"
        - type: object
          properties:
            geoJson:
              $ref: "#/components/schemas/MultiPoint"
    GeoJsonPoint:
      type: object
      description: "Container for a GeoJSON Point: A single position"
      allOf:
        - $ref: "#/components/schemas/GeographicLocation"
        - type: object
          properties:
            geoJson:
              $ref: "#/components/schemas/Point"
    GeoJsonPolygon:
      type: object
      description: "Container for GeoJSON Polygon: An array of linear rings"
      allOf:
        - $ref: "#/components/schemas/GeographicLocation"
        - type: object
          properties:
            geoJson:
              $ref: "#/components/schemas/Polygon"
    LineString:
      type: object
      description: "GeoJSON: A collection of Points forming a connected line"
      required:
        - coordinates
      properties:
        coordinates:
          $ref: "#/components/schemas/lineString"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    MultiLineString:
      type: object
      description: A collection of distinct LineStrings
      required:
        - coordinates
        - type
      properties:
        type:
          type: string
        coordinates:
          type: array
          items:
            $ref: "#/components/schemas/lineString"
          minItems: 1
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    MultiPoint:
      type: object
      description: A collection of Points
      required:
        - coordinates
        - type
      properties:
        type:
          type: string
        coordinates:
          $ref: "#/components/schemas/positionArray"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Point:
      type: object
      description: "GeoJSON: A single position"
      required:
        - coordinates
        - type
      properties:
        type:
          type: string
        coordinates:
          $ref: "#/components/schemas/position"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    Polygon:
      type: object
      description: An array of linear rings
      required:
        - coordinates
        - type
      properties:
        type:
          type: string
        coordinates:
          $ref: "#/components/schemas/polygon"
        "@baseType":
          type: string
          description: When sub-classing, this defines the super-class
        "@schemaLocation":
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes and
            relationships
        "@type":
          type: string
          description: When sub-classing, this defines the sub-class entity name
    position:
      description: "GeoJSON: A single position"
      type: array
      minItems: 2
      items:
        type: number
      maxItems: 2
    positionArray:
      description: "GeoJSON: An array of positions"
      type: array
      items:
        $ref: "#/components/schemas/position"
    lineString:
      description: "GeoJSON: An array of two or more positions"
      allOf:
        - $ref: "#/components/schemas/positionArray"
        - minItems: 2
    linearRing:
      description: "GeoJSON: An array of four positions where the first equals the last"
      allOf:
        - $ref: "#/components/schemas/positionArray"
        - minItems: 4
    polygon:
      description: "GeoJSON: An array of linear rings"
      type: array
      items:
        $ref: "#/components/schemas/linearRing"
    Error:
      description: Used when an API throws an Error, typically with a HTTP error
        response-code (3xx, 4xx, 5xx)
      type: object
      required:
